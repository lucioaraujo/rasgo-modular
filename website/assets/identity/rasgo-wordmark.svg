<!-- Derivado do master `apps/panel/assets/rasgo_logo_2026.svg`.
     O master tem fill #000000 (foi desenhado pra fundo claro) e, copiado
     cru pra um site de fundo escuro, sumia. Aqui o preenchimento é
     `currentColor`: a marca passa a herdar a cor de quem a contém, então
     ela segue os tokens do instrumento em vez de fixar um valor que
     envelhece à parte da paleta.
     WEBSITES.md §7: o site guarda derivados otimizados; o master fica no
     instrumento. Metadados do Inkscape removidos (4,0K -> este arquivo).

     viewBox APERTADO à tinta (era `0 0 272 56`, com 12,62 unidades de
     folga acima e abaixo). Duas consequências, ambas desejadas: `height`
     passa a medir as LETRAS e não uma caixa com ar, e a borda inferior do
     SVG coincide com a LINHA DE BASE — "RASGO" não tem descendentes, então
     a base da tinta é a baseline. É isso que permite alinhar o wordmark
     com o texto ao lado por `align-self: baseline`, em vez de centralizar
     no olho e errar. -->
