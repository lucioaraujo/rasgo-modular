name: Rasgo Modular — build, test & package

# Constrói, testa e empacota nos três sistemas. Existe porque o gate de
# publicação exige "ao menos um caminho de build/execução verificável por
# plataforma suportada", e sem máquina Windows ou macOS à mão é esta CI
# que produz a evidência.
#
# HISTÓRICO, porque a lição é cara: até 21 set. 2026 este arquivo estava
# INERTE e ninguém sabia. O GitHub Actions só lê workflows do
# `.github/workflows/` da RAIZ do repositório, e o projeto vivia dentro do
# monorepo `rasgo-instruments` — o arquivo existia, parecia pronto, e
# nunca tinha rodado uma única vez. Quando a extração pro repositório
# próprio o acordou, os três jobs falharam e foi preciso corrigir CINCO
# defeitos reais, dois deles impedindo a compilação por completo
# (`std::filesystem` contra um deployment target de 10.13 no macOS;
# `M_PI`, que o MSVC não define, em 83 lugares do código).
#
# Mesmo caminho do Antitotem (27 ago. 2026) e do Navalha 2, cujos
# workflows moram na mesma posição relativa e também só ficaram vivos
# depois da extração. Ver `RASGO_DOCUMENTATION/ESTRATEGIA_DE_PUBLICACAO.md`.

# NÃO roda a cada push — e isto foi aprendido caro.
#
# Em 24 set. 2026 a conta do autor bateu 100% dos 2.000 minutos mensais
# incluídos. A causa: 22 execuções em dois dias, uma por push meu, a ~16
# minutos cada. O que torna isso caro não é o tempo de parede e sim os
# MULTIPLICADORES de cobrança da GitHub — macOS conta 10×, Windows 2×,
# Linux 1×:
#
#     Ubuntu   x1   ~   265 min
#     Windows  x2   ~   708 min
#     macOS    x10  ~ 2.832 min
#     TOTAL         ~ 3.805 min   (contra 2.000 incluídos)
#
# Ou seja, cada push custava ~160 minutos cobrados. Eu tratei a CI como
# se rodar fosse de graça.
#
# Agora roda quando FAZ SENTIDO gastar: em tag de versão (que é quando os
# instaladores importam), em pull request (revisão de mudança real) e à
# mão, pelo botão "Run workflow". O trabalho do dia a dia é validado
# localmente pelos 78 testes, que rodam em 40 segundos e não custam nada.
#
# NOTA: repositório PÚBLICO tem Actions gratuito e ilimitado nos runners
# padrão. Quando este projeto for publicado, este problema desaparece
# sozinho — e aí vale reconsiderar o gatilho por push.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

# Um push novo cancela a execução anterior ainda em andamento. Sem isto,
# corrigir um erro enquanto a CI roda paga pelas DUAS execuções — e as
# duas primeiras rodadas deste projeto foram exatamente isso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `ubuntu-22.04` fixo, e NÃO `ubuntu-latest`. O `.deb` herda as
          # versões de biblioteca da máquina que o compilou: com o
          # `latest` (hoje 24.04) a dependência saía `libasound2t64` —
          # nome que veio da transição do `time_t` para 64 bits e que não
          # existe no Ubuntu 22.04, cujo suporte vai até 2027. O pacote
          # simplesmente não instalava lá, e ninguém tinha decidido isso:
          # era efeito colateral de seguir o `latest`.
          #
          # Compilar no 22.04 é a direção que funciona: binário feito
          # contra bibliotecas mais antigas roda em sistema mais novo, o
          # contrário não. Um único `.deb` passa a atender 22.04, 24.04 e
          # derivados (Mint 21 e 22 inclusive).
          #
          # O job do Ubuntu sai com TRÊS pacotes: .deb (CPack), AppImage e
          # .tar.gz (packaging/linux/empacotar.sh) — os dois últimos para
          # Fedora, Arch, openSUSE e quem não instala .deb.
          - os: ubuntu-22.04
            generator: DEB
            artifact-glob: |
              build/*.deb
              build/*.AppImage
              build/*.tar.gz
          # Windows: instalador (NSIS) e versão portátil (.zip, só
          # descompactar e abrir); os dois levam o .exe com runtime estático.
          - os: windows-latest
            generator: NSIS
            artifact-glob: |
              build/*.exe
              build/*.zip
          - os: macos-latest
            generator: DragNDrop
            artifact-glob: build/*.dmg
    # nome explícito: o padrão juntaria a lista de globs do Ubuntu ao nome
    name: package (${{ matrix.os }}, ${{ matrix.generator }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Rasgo Modular
        uses: actions/checkout@v4

      # O JUCE não é versionado neste repositório (nem submodule, nem
      # FetchContent) — mesma política do Antitotem/Navalha 2/Rasgo Synth.
      # Fixado numa tag (6 out. 2026): até a v0.1.3 era `master`, e cada
      # build compilava contra o JUCE do dia, o que não é reproduzível.
      # Mudar a versão é decisão registrada aqui e em
      # apps/juce/LICENSE_STATUS.md.
      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: '9.0.3'
          path: JUCE-checkout

      # Dependências de build do JUCE no Linux. Windows (MSVC) e macOS
      # (Xcode) já trazem o necessário nos runners.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgtk-3-dev \
            libglu1-mesa-dev mesa-common-dev
          # O WebKit mudou de nome entre as versões do Ubuntu: `4.1` a
          # partir do 23.04, `4.0` no 22.04. Fixar um só quebraria a CI
          # ao trocar de runner — que é exatamente a troca que acabamos
          # de fazer. Tenta o novo e cai no antigo.
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DRASGO_MODULAR_JUCE_PATH=${{ github.workspace }}/JUCE-checkout

      # O MOTOR nos três sistemas. O núcleo é framework-free por projeto,
      # mas até aqui só tinha sido compilado no Linux — esta é a primeira
      # prova real dessa portabilidade, e vale por si mesma
      # (independente do empacotamento).
      # `--parallel` sem número usa todos os núcleos, e cada unidade de
      # tradução do JUCE come muita memória. No runner do Ubuntu isso
      # matou o compilador:
      #
      #   c++: fatal error: Killed signal terminated program cc1plus
      #
      # que é o OOM killer, não erro de código — e é fácil confundir os
      # dois, porque a mensagem parece falha de compilação. Dois em
      # paralelo cabem na memória do runner e ainda aproveitam os
      # núcleos: o build demora um pouco mais e TERMINA, que é o que
      # interessa numa CI.
      - name: Build & run engine tests
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure

      - name: Build the JUCE app
        run: cmake --build build --target RasgoModularApp --config Release --parallel 2

      # Sem Mac à mão pra testar na unha, isto substitui o teste manual:
      # falha o build se o .app não for realmente distribuível (Universal 2
      # de verdade e deployment target do projeto, não a versão do runner —
      # o bug que o Antitotem e o Navalha 2 pegaram ao vivo).
      - name: Validate macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(find build -maxdepth 6 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          echo "App bundle: $APP"
          EXE="$APP/Contents/MacOS/Rasgo Modular"

          echo "--- file (architecture) ---"
          file "$EXE"
          if ! file "$EXE" | grep -q "Mach-O universal binary with 2 architectures"; then
            echo "::error::Expected a Universal 2 (x86_64+arm64) binary"; exit 1
          fi
          if ! (lipo -info "$EXE" | grep -q "x86_64" && lipo -info "$EXE" | grep -q "arm64"); then
            echo "::error::Missing x86_64 or arm64 slice"; exit 1
          fi

          echo "--- otool -l (deployment target) ---"
          otool -l "$EXE" | grep -A4 "LC_BUILD_VERSION\|LC_VERSION_MIN_MACOSX"
          MINOS=$(otool -l "$EXE" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "minos=$MINOS"
          if [[ "$MINOS" == 2[0-9].* ]]; then
            echo "::error::minos $MINOS looks like it defaulted to the runner's own macOS version, not the project's deployment target"
            exit 1
          fi

          # Assinatura ad-hoc do PACOTE INTEIRO, nas duas fatias. Até a
          # v0.1.3 só a fatia arm64 tinha a assinatura automática do
          # linker, a x86_64 não tinha nenhuma e o .app não era selado (sem
          # _CodeSignature): baixado num Mac com chip Apple, o Gatekeeper
          # tende a dizer "está danificado e não pode ser aberto", sem saída
          # para um usuário comum. Selado ad-hoc, o aviso volta a ser o de
          # desenvolvedor não identificado, que se libera em Ajustes →
          # Privacidade e Segurança → "Abrir Mesmo Assim". Tirar o aviso de
          # vez exige Developer ID + notarização (conta paga da Apple).
          # Achado em 6 out. 2026 lendo os comandos de carga do binário
          # publicado.
          echo "--- codesign ad-hoc (pacote inteiro) ---"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for arch in x86_64 arm64; do
            codesign -dv --arch "$arch" "$APP" 2>&1 | grep -q "Signature=adhoc" \
              || { echo "::error::fatia $arch sem assinatura ad-hoc"; exit 1; }
          done
          test -d "$APP/Contents/_CodeSignature" || { echo "::error::pacote não selado"; exit 1; }
          echo "ok: pacote selado, duas fatias assinadas (ad-hoc)"

      # O .exe não pode depender do Visual C++ Redistributable: a v0.1.3
      # dependia (MSVCP140/VCRUNTIME140) e não abria num Windows sem ele, e
      # este runner, que já tem o pacote, nunca percebeu. Lista as DLLs
      # importadas e falha se alguma do runtime dinâmico aparecer.
      - name: Validate Windows runtime (static CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path build -Filter 'Rasgo Modular.exe' |
                 Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'Rasgo Modular.exe não encontrado' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin não encontrado' }
          $deps = & $dumpbin.FullName /dependents $exe.FullName
          $deps
          $bad = $deps | Select-String -Pattern 'VCRUNTIME|MSVCP|api-ms-win-crt'
          if ($bad) { Write-Error "o .exe depende do runtime dinâmico do Visual C++: $bad"; exit 1 }
          "ok: sem dependência do Visual C++ Redistributable"

      - name: Package
        working-directory: build
        run: cpack -G ${{ matrix.generator }} -C Release

      # Mesma árvore do `cmake --install` que o .deb usa; linuxdeploy
      # fixado por versão e hash dentro do script.
      - name: Versão portátil (.zip, Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: cpack -G ZIP -C Release

      - name: AppImage e .tar.gz (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/empacotar.sh build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasgo-modular-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  # ---- arranque-linux: os pacotes Linux abrem em outras distribuições? ---
  #
  # O .deb é compilado no Ubuntu 22.04; o AppImage e o .tar.gz prometem
  # rodar em qualquer distribuição de 2022 em diante. Esta é a prova: cada
  # contêiner instala só o que um desktop comum já tem (X11, ALSA,
  # FreeType, Fontconfig), abre o app numa tela virtual, sem placa de som,
  # e confere que ele chega ao primeiro quadro e não cai
  # (packaging/linux/testar-arranque.sh). Nos dois sistemas Debian o .deb
  # é instalado pelo apt, o que confere também as dependências declaradas.
  #
  # Só Linux: multiplicador 1, e gratuito em repositório público. Não testa
  # som nem desenho — testa o defeito que mais custa a quem baixa: o app
  # que nem abre.
  arranque-linux:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        imagem: ['debian:12', 'ubuntu:24.04', 'fedora:latest', 'archlinux:latest']
    container: ${{ matrix.imagem }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar os pacotes Linux
        uses: actions/download-artifact@v4
        with:
          name: rasgo-modular-ubuntu-22.04
          path: pacotes

      - name: Instalar o básico de um desktop (e o .deb, onde couber)
        run: |
          set -eux
          case "${{ matrix.imagem }}" in
            debian:*|ubuntu:*)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ./pacotes/*.deb
              apt-get install -y xvfb libx11-6 libxext6 libxrandr2 \
                libxcursor1 libxinerama1 libxrender1 fonts-dejavu-core ;;
            fedora:*)
              dnf install -y xorg-x11-server-Xvfb alsa-lib freetype fontconfig \
                libX11 libXext libXrandr libXcursor libXinerama libXrender dejavu-sans-fonts ;;
            archlinux:*)
              pacman -Syu --noconfirm xorg-server-xvfb alsa-lib freetype2 fontconfig \
                libx11 libxext libxrandr libxcursor libxinerama libxrender ttf-dejavu ;;
          esac

      - name: Abrir o .deb instalado
        if: startsWith(matrix.imagem, 'debian') || startsWith(matrix.imagem, 'ubuntu')
        run: packaging/linux/testar-arranque.sh /usr/bin/rasgo-modular

      - name: Abrir o AppImage
        run: |
          chmod +x pacotes/*.AppImage
          packaging/linux/testar-arranque.sh "$(ls pacotes/*.AppImage)"

      - name: Abrir o .tar.gz
        run: |
          mkdir tgz && tar -xzf pacotes/*.tar.gz -C tgz
          packaging/linux/testar-arranque.sh "$(ls tgz/*/bin/rasgo-modular)"

  # ---- release: onde a tag vira algo que alguém consegue BAIXAR --------
  #
  # Faltava este passo, e a falta era séria: `upload-artifact` guarda os
  # pacotes como ARTEFATO DO ACTIONS, que exige estar logado no GitHub,
  # vem zipado por cima do instalador e EXPIRA em 90 dias. Não é download
  # público, e o site não pode apontar para ele. Sem este job, criar a tag
  # v0.1.0 não produziria nada que um músico consiga instalar.
  #
  # Roda só em tag (`v*`), depois dos três empacotamentos, e em Linux —
  # multiplicador 1 no faturamento, alguns segundos de execução. O custo é
  # desprezível ao lado dos ~160 minutos cobrados dos três builds.
  #
  # `gh` já vem nos runners: sem ação de terceiro no caminho de publicação,
  # que é onde proveniência importa mais.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # também espera o teste de abertura: um pacote Linux que não abre não
    # entra na release
    needs: [package, arranque-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write        # criar a release e anexar os pacotes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the three packages
        uses: actions/download-artifact@v4
        with:
          path: pacotes

      - name: Conferir o que chegou
        run: |
          find pacotes -type f -print
          # os cinco precisam estar aqui: uma release com metade dos pacotes
          # é pior que nenhuma, porque parece completa
          for ext in deb AppImage tar.gz dmg exe zip; do
            if ! find pacotes -type f -name "*.$ext" | grep -q .; then
              echo "::error::nenhum pacote .$ext entre os artefatos"
              exit 1
            fi
          done

      - name: Criar a release com os pacotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag com hífen (v0.1.2-rc1) é PRÉ-RELEASE: os instaladores ficam
          # baixáveis para teste, mas a versão anterior continua sendo a
          # "Latest" e o site não aponta para ela. Decisão do autor em 2
          # out. 2026: testar baixando do GitHub antes de publicar.
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" ${PRE} \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Rasgo Modular ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes "Release notes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) (English summary at the top of each version) · installation per platform: [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md).

          **Linux:** \`.deb\` for Ubuntu, Debian and Mint; AppImage or \`.tar.gz\` for other distributions (x86-64, glibc 2.35+, tested at launch on Debian 12, Ubuntu 24.04, Fedora and Arch).

          **Stated limitation:** the macOS package was built, packaged and tested **by continuous integration only** — the author has not opened it on a real Mac (the Windows package was installed and played by the author on Windows 10, 6 Oct. 2026). On first launch Windows and macOS show a security warning; what to click: [INSTALL.md → Installing, step by step](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md#installing-step-by-step). The macOS package is ad-hoc signed, without Developer ID or notarisation, so Gatekeeper warns on first launch.

          ---

          Notas desta versão: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) · instalação por plataforma: [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md).

          **Linux:** \`.deb\` para Ubuntu, Debian e Mint; AppImage ou \`.tar.gz\` para as demais distribuições (x86-64, glibc 2.35+, testados na abertura em Debian 12, Ubuntu 24.04, Fedora e Arch).

          **Limitação declarada:** o pacote macOS foi construído, empacotado e testado **somente pela integração contínua** — o autor não o abriu num Mac real (o de Windows foi instalado e tocado pelo autor num Windows 10 em 6 out. 2026). Na primeira abertura, Windows e macOS mostram um aviso de segurança; o que clicar: [INSTALL.md → Instalar, passo a passo](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md#instalar-passo-a-passo). O pacote macOS tem assinatura ad-hoc, sem Developer ID nem notarização, então o Gatekeeper mostra aviso na primeira abertura." \
            $(find pacotes -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \))
