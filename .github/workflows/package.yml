name: Rasgo Modular — build, test & package

# Constrói, testa e empacota nos três sistemas. Existe porque o gate de
# publicação exige "ao menos um caminho de build/execução verificável por
# plataforma suportada", e sem máquina Windows ou macOS à mão é esta CI
# que produz a evidência.
#
# HISTÓRICO, porque a lição é cara: até 21 set. 2026 este arquivo estava
# INERTE e ninguém sabia. O GitHub Actions só lê workflows do
# `.github/workflows/` da RAIZ do repositório, e o projeto vivia dentro do
# monorepo `rasgo-instruments` — o arquivo existia, parecia pronto, e
# nunca tinha rodado uma única vez. Quando a extração pro repositório
# próprio o acordou, os três jobs falharam e foi preciso corrigir CINCO
# defeitos reais, dois deles impedindo a compilação por completo
# (`std::filesystem` contra um deployment target de 10.13 no macOS;
# `M_PI`, que o MSVC não define, em 83 lugares do código).
#
# Mesmo caminho do Antitotem (27 ago. 2026) e do Navalha 2, cujos
# workflows moram na mesma posição relativa e também só ficaram vivos
# depois da extração. Ver `RASGO_DOCUMENTATION/ESTRATEGIA_DE_PUBLICACAO.md`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `ubuntu-22.04` fixo, e NÃO `ubuntu-latest`. O `.deb` herda as
          # versões de biblioteca da máquina que o compilou: com o
          # `latest` (hoje 24.04) a dependência saía `libasound2t64` —
          # nome que veio da transição do `time_t` para 64 bits e que não
          # existe no Ubuntu 22.04, cujo suporte vai até 2027. O pacote
          # simplesmente não instalava lá, e ninguém tinha decidido isso:
          # era efeito colateral de seguir o `latest`.
          #
          # Compilar no 22.04 é a direção que funciona: binário feito
          # contra bibliotecas mais antigas roda em sistema mais novo, o
          # contrário não. Um único `.deb` passa a atender 22.04, 24.04 e
          # derivados (Mint 21 e 22 inclusive).
          - os: ubuntu-22.04
            generator: DEB
            artifact-glob: build/*.deb
          - os: windows-latest
            generator: NSIS
            artifact-glob: build/*.exe
          - os: macos-latest
            generator: DragNDrop
            artifact-glob: build/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Rasgo Modular
        uses: actions/checkout@v4

      # O JUCE não é versionado neste repositório (nem submodule, nem
      # FetchContent) — mesma política do Antitotem/Navalha 2/Rasgo Synth.
      # `ref: master` segue o upstream; pra uma release reprodutível,
      # fixar aqui o commit/tag usado e registrá-lo na release
      # (ver apps/juce/LICENSE_STATUS.md).
      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE-checkout

      # Dependências de build do JUCE no Linux. Windows (MSVC) e macOS
      # (Xcode) já trazem o necessário nos runners.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgtk-3-dev \
            libglu1-mesa-dev mesa-common-dev
          # O WebKit mudou de nome entre as versões do Ubuntu: `4.1` a
          # partir do 23.04, `4.0` no 22.04. Fixar um só quebraria a CI
          # ao trocar de runner — que é exatamente a troca que acabamos
          # de fazer. Tenta o novo e cai no antigo.
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DRASGO_MODULAR_JUCE_PATH=${{ github.workspace }}/JUCE-checkout

      # O MOTOR nos três sistemas. O núcleo é framework-free por projeto,
      # mas até aqui só tinha sido compilado no Linux — esta é a primeira
      # prova real dessa portabilidade, e vale por si mesma
      # (independente do empacotamento).
      # `--parallel` sem número usa todos os núcleos, e cada unidade de
      # tradução do JUCE come muita memória. No runner do Ubuntu isso
      # matou o compilador:
      #
      #   c++: fatal error: Killed signal terminated program cc1plus
      #
      # que é o OOM killer, não erro de código — e é fácil confundir os
      # dois, porque a mensagem parece falha de compilação. Dois em
      # paralelo cabem na memória do runner e ainda aproveitam os
      # núcleos: o build demora um pouco mais e TERMINA, que é o que
      # interessa numa CI.
      - name: Build & run engine tests
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure

      - name: Build the JUCE app
        run: cmake --build build --target RasgoModularApp --config Release --parallel 2

      # Sem Mac à mão pra testar na unha, isto substitui o teste manual:
      # falha o build se o .app não for realmente distribuível (Universal 2
      # de verdade e deployment target do projeto, não a versão do runner —
      # o bug que o Antitotem e o Navalha 2 pegaram ao vivo).
      - name: Validate macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(find build -maxdepth 6 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          echo "App bundle: $APP"
          EXE="$APP/Contents/MacOS/Rasgo Modular"

          echo "--- file (architecture) ---"
          file "$EXE"
          if ! file "$EXE" | grep -q "Mach-O universal binary with 2 architectures"; then
            echo "::error::Expected a Universal 2 (x86_64+arm64) binary"; exit 1
          fi
          if ! (lipo -info "$EXE" | grep -q "x86_64" && lipo -info "$EXE" | grep -q "arm64"); then
            echo "::error::Missing x86_64 or arm64 slice"; exit 1
          fi

          echo "--- otool -l (deployment target) ---"
          otool -l "$EXE" | grep -A4 "LC_BUILD_VERSION\|LC_VERSION_MIN_MACOSX"
          MINOS=$(otool -l "$EXE" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "minos=$MINOS"
          if [[ "$MINOS" == 2[0-9].* ]]; then
            echo "::error::minos $MINOS looks like it defaulted to the runner's own macOS version, not the project's deployment target"
            exit 1
          fi

          echo "--- codesign (ad-hoc; sem Developer ID/notarização na CI) ---"
          codesign -dv "$APP" 2>&1 || echo "::warning::Não assinado — ok pra teste local, mas distribuição real precisa de Developer ID + notarização, senão o Gatekeeper mostra aviso de desenvolvedor não identificado na primeira abertura"

      - name: Package
        working-directory: build
        run: cpack -G ${{ matrix.generator }} -C Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasgo-modular-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
