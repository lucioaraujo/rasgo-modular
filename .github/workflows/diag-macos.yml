# Diagnóstico (23/11/2026): o chiado do TAPE no macOS. Só no ramo diag/macos-tape.
name: Diagnóstico — TAPE no macOS
on:
  push:
    branches: ['diag/macos-tape']
jobs:
  sonda:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Teste do TAPE com opções diferentes
        run: |
          echo "=== a: c++ -O2"; c++ -std=c++17 -O2 -Isrc tests/test_tape.cpp -o ta && ./ta || true
          echo "=== b: -O3 -DNDEBUG 10.15 arm64"; c++ -std=c++17 -O3 -DNDEBUG -mmacosx-version-min=10.15 -arch arm64 -Isrc tests/test_tape.cpp -o tb && ./tb || true
          echo "=== c: universal"; c++ -std=c++17 -O3 -DNDEBUG -mmacosx-version-min=10.15 -arch x86_64 -arch arm64 -Isrc tests/test_tape.cpp -o tc && ./tc || true
          echo "=== c x86_64 (Rosetta)"; arch -x86_64 ./tc || true
          echo "=== sonda universal"; c++ -std=c++17 -O3 -DNDEBUG -mmacosx-version-min=10.15 -arch x86_64 -arch arm64 -Isrc tools/sonda_tape.cpp -o sc && ./sc || true
      - name: CMake (como a CI)
        run: |
          cmake -B b -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build b --target rasgo_modular_tape_tests --config Release > /dev/null
          echo "=== d: cmake"; ./b/rasgo_modular_tape_tests || true
          grep -E "CMAKE_CXX_FLAGS_RELEASE|CMAKE_OSX" b/CMakeCache.txt
