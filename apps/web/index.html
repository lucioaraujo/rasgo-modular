<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rasgo Modular — tocar no navegador</title>
<meta name="description" content="O Rasgo Modular inteiro no navegador: um patch de seed já montado, 105 módulos, cabos, VARIA, LEARN e gravação. Clique e toque." />
<link rel="canonical" href="https://lucioaraujo.github.io/rasgo-modular/play/" />
<link rel="icon" href="../assets/identity/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="../assets/identity/favicon-32.png" type="image/png" sizes="32x32" />
<meta property="og:title" content="Rasgo Modular — tocar no navegador" />
<meta property="og:description" content="O sintetizador modular generativo da família RASGO, inteiro no navegador." />
<meta property="og:url" content="https://lucioaraujo.github.io/rasgo-modular/play/" />
<meta property="og:image" content="https://lucioaraujo.github.io/rasgo-modular/assets/images/og-rasgo-modular.jpg" />
<style>
  /* os tokens do app (`T` em RasgoModularApp.cpp) */
  :root { --bg: #131a1a; --surface: #262b36; --recessed: #0e1015; --line: #485060; --text: #f0f3f8;
          --muted: #bec8d8; --prata: #d8dde6; --accent: #ff9d4c; --warning: #ff6b5b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  /* O cabeçalho do app (`HeaderBar`): uma fileira de 46 px que quebra em
     duas quando não cabe; grupos separados por uma régua fina */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 6px; padding: 12px 12px 11px 14px;
           background: var(--bg); border-bottom: 1px solid var(--line); font: 9.5px system-ui, sans-serif; }
  .grupo { display: flex; align-items: center; gap: 6px; }
  .direita { margin-left: auto; }
  .marca { display: flex; align-items: center; gap: 7px; margin-right: 6px; padding-right: 10px;
           border-right: 1px solid var(--line); height: 26px; }
  .marca span { color: var(--muted); font-size: 9.5px; letter-spacing: .02em; }
  .regua { width: 1px; height: 16px; background: var(--line); margin: 0 3px 0 1px; }
  header button { height: 22px; padding: 0 7px; background: transparent; color: var(--muted);
                  border: 1px solid var(--line); border-radius: 0; font: inherit; cursor: pointer;
                  white-space: nowrap; }
  header button:hover { border-color: var(--muted); }
  /* o foco do teclado no cabeçalho (F6): o contorno de acento, como no app */
  header button:focus-visible, header .trilho:focus-visible { outline: 1px solid var(--prata); outline-offset: 2px; }
  /* ligado / o realce de um instante (`flashing`): cheio, com o anel */
  /* o cabeçalho inteiro em prata (autor, 27/11/2026: "há botões no cabeçalho
     ainda em laranja"; em 24/11 só VARIA, RACK e ABRE tinham passado) */
  header button.on { background: var(--prata); border-color: var(--prata); color: var(--bg);
                     outline: 1px solid var(--prata); outline-offset: 2px; }
  header button.tocar { background: var(--prata); border-color: var(--prata); color: var(--bg); }
  /* REC gravando: o botão é também o relógio da tomada (`T.recording`) */
  header button.gravando { background: #e0362c; border-color: #e0362c; color: var(--bg);
                           outline: 1px solid #e0362c; outline-offset: 2px; }
  .rotulo { color: var(--muted); }
  .rotulo.vivo { color: var(--text); }
  #r-varia { cursor: pointer; }
  #seed { width: 21ch; height: 22px; background: var(--recessed); color: var(--text); border: 1px solid var(--line);
          padding: 0 4px; font: 11px ui-monospace, monospace; border-radius: 0; }
  #seed:focus { outline: none; border-color: var(--prata); }
  /* slider do VARIA e do volume (`varySlider_`): 84 × 14, zero = desligado */
  .trilho { position: relative; width: 84px; height: 14px; background: var(--recessed); border-radius: 3px;
            cursor: pointer; touch-action: none; }
  .trilho .cheio { position: absolute; left: 1px; top: 1px; bottom: 1px; background: var(--prata); border-radius: 2px; }
  .trilho .meio { position: absolute; left: 42px; top: 2px; bottom: 2px; width: 1px; background: rgba(190, 200, 216, .7); }
  #leitura { color: var(--muted); font-size: 9.5px; white-space: nowrap; }
  #leitura.aviso { color: var(--text); white-space: normal; max-width: 46ch; }
  #vu { width: 54px; height: 8px; background: var(--recessed); position: relative; }
  #vu div { position: absolute; left: 0; top: 0; bottom: 0; background: var(--prata); }
  #corpo { flex: 1; display: flex; min-height: 0; }
  #direita { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* a faixa de crédito (`CreditsStrip`): 16 px, à direita, em cima do rack */
  #creditos { height: 16px; flex: none; display: flex; justify-content: space-between; gap: 12px;
              padding: 0 10px 0 14px; color: var(--muted);
              font: 8.6px/16px system-ui, sans-serif; white-space: nowrap; overflow: hidden; }
  /* a leitura (módulos · cabos) desceu do cabeçalho para esta faixa (26/11/2026):
     ao começar o som ela alargava o cabeçalho, que quebrava em duas linhas */
  #creditos #leitura { font-size: 8.6px; }
  /* TUTORIAL e SOBRE (`OverlayView`): véu sobre o rack e um cartão */
  #sobrepor { position: fixed; inset: 0; background: rgba(19, 26, 26, .82); display: none; z-index: 9;
              align-items: center; justify-content: center; }
  #sobrepor.aberto { display: flex; }
  #sobrepor .cartao { position: relative; width: min(820px, calc(100vw - 60px)); max-height: calc(100vh - 60px);
                      background: var(--surface); border: 1px solid var(--prata); padding: 30px 24px 16px 24px;
                      display: flex; flex-direction: column; }
  #sobrepor.sobre .cartao { height: auto; }
  #sobrepor.tutorial .cartao { height: calc(100vh - 60px); }
  #o-fechar { position: absolute; right: 12px; top: 10px; height: 20px; background: none; border: 1px solid var(--line);
              color: var(--muted); font: 9.5px system-ui, sans-serif; padding: 0 7px; cursor: pointer; }
  #o-titulo { margin: 0; font: 13.8px system-ui, sans-serif; color: var(--prata); }
  #o-sub { margin: 4px 0 8px; font: 11.2px system-ui, sans-serif; color: var(--muted); }
  #o-corpo { flex: 1; min-height: 0; overflow-y: auto; outline: none; font: 11.2px/1.45 system-ui, sans-serif;
             color: var(--muted); max-width: 640px; padding-right: 10px;
             scrollbar-width: thin; scrollbar-color: var(--line) var(--recessed); }
  #o-corpo h3 { font: bold 12px system-ui, sans-serif; color: var(--prata); margin: 0 0 8px; }
  #o-corpo p { margin: 0 0 18px; white-space: pre-line; }
  #o-corpo hr { border: 0; border-top: 1px solid var(--line); margin: 0 0 14px; }
  #o-corpo a { color: var(--prata); }
  #o-corpo a:hover { color: var(--text); }
  #o-corpo .linha { margin: 0 0 3px; }
  #o-corpo .alerta { color: var(--warning); }
  #rolagem { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; }
  /* a paleta (`PaletteColumn`): as famílias na cor delas, os tipos em 11 px;
     arrastar um tipo para o rack o acrescenta; um módulo solto aqui sai */
  #paleta { width: 186px; flex: none; display: flex; flex-direction: column; background: var(--bg);
            border-right: 1px solid var(--line); font: 9.5px system-ui, sans-serif; user-select: none; touch-action: none; }
  #lista { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 0 14px;
           scrollbar-width: thin; scrollbar-color: var(--line) var(--recessed); }
  /* a caixa LEARN, no pé da paleta: título, valor, e os três níveis do
     verbete (o que é · como funciona · → para experimentar) */
  #learn { flex: none; height: 232px; background: var(--recessed); border-top: 1px solid var(--line);
           display: flex; flex-direction: column; padding: 6px 8px 4px; user-select: text; outline: none;
           --lf: 10.3px; --lp: var(--text); --ls: var(--muted); --le: var(--prata); }
  #learn.foco { box-shadow: inset 0 0 0 1px var(--accent); }
  #learn.branco { --lp: #fff; --ls: #fff; --le: #fff; }
  #learn .topo { display: flex; align-items: center; color: var(--prata); font-size: 8.6px; height: 14px; }
  #learn .topo button { margin-left: auto; height: 18px; background: none; border: 0; color: var(--prata);
                        font: inherit; cursor: pointer; padding: 0 4px; }
  #learn .corpo { flex: 1; min-height: 0; overflow-y: auto; margin-top: 8px; font-size: var(--lf); line-height: 1.3;
                  scrollbar-width: thin; scrollbar-color: var(--line) var(--recessed); padding-right: 4px; }
  #learn .corpo p { margin: 0 0 7px; white-space: pre-line; }
  #learn .t { color: var(--le); font-weight: bold; margin-bottom: 5px; }
  #learn .v { color: var(--lp); }
  #learn .q { color: var(--lp); }
  #learn .u { color: var(--ls); }
  #learn .e { color: var(--le); }
  #learn .ocioso { color: var(--muted); }
  #learn .aviso { color: var(--accent); }
  #learn .dica { color: var(--muted); font-size: 8.6px; height: 13px; }
  #leitura-menu { position: fixed; z-index: 11; background: var(--surface); border: 1px solid var(--line);
                  font: 11px system-ui, sans-serif; min-width: 270px; padding: 4px 0; display: none; }
  #leitura-menu.aberto { display: block; }
  #leitura-menu div { padding: 6px 14px; color: var(--text); cursor: pointer; }
  #leitura-menu div:hover { background: rgba(255, 157, 76, .18); }
  #leitura-menu .cab { color: var(--muted); cursor: default; }
  #leitura-menu .cab:hover { background: none; }
  #leitura-menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  #paleta.alvo { outline: 1px solid var(--accent); outline-offset: -2px; }
  #paleta h3 { display: flex; align-items: center; gap: 4px; margin: 0; padding: 0 10px; height: 18px;
               font: inherit; font-weight: normal; }
  #paleta h3 i { width: 8px; height: 8px; display: inline-block; }
  #paleta li { list-style: none; padding-left: 18px; height: 15px; line-height: 15px; color: var(--muted);
               cursor: grab; }
  #paleta li:hover { color: var(--accent); }
  #paleta ul { margin: 0 0 4px; padding: 0; }
  /* o banco de escalas do QUANTIZER (`ScaleBrowser`) */
  #banco { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none; z-index: 10;
           align-items: center; justify-content: center; font: 11px system-ui, sans-serif; }
  #banco.aberto { display: flex; }
  #banco .cartao { width: min(820px, calc(100vw - 40px)); height: min(600px, calc(100vh - 40px));
                   background: var(--surface); border: 2px solid var(--line); display: flex; flex-direction: column;
                   padding: 10px 12px 12px; gap: 8px; }
  #banco h2 { margin: 0 4px; font: bold 13.5px system-ui, sans-serif; color: var(--text); display: flex; }
  #banco h2 button { margin-left: auto; background: none; border: 0; color: var(--text); font-size: 16px; cursor: pointer; }
  #banco input { height: 26px; background: var(--recessed); color: var(--text); border: 1px solid var(--line);
                 padding: 0 6px; font: 11px system-ui, sans-serif; margin: 0 4px; }
  #banco input:focus { outline: none; border-color: var(--accent); }
  #banco .listas { flex: 1; min-height: 0; display: flex; gap: 10px; }
  #banco .lista { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) var(--recessed); }
  #b-familias { width: 40%; border-right: 1px solid var(--line); }
  #b-escalas { flex: 1; }
  #banco .lista div { height: 22px; line-height: 22px; padding: 0 6px; color: var(--text); cursor: pointer;
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #banco .lista div:hover { color: var(--accent); }
  #banco .lista div.on { background: rgba(255, 157, 76, .18); color: var(--accent); }
  #b-conta { text-align: right; color: var(--muted); font-size: 9.5px; height: 12px; }
  #b-info { border-top: 1px solid var(--line); padding: 8px 4px 0; height: 124px; display: flex; flex-direction: column; gap: 3px; }
  #b-info b { color: var(--text); font-size: 11px; }
  #b-info .fonte { color: var(--muted); font-size: 9.5px; max-height: 26px; overflow: hidden; }
  #b-regua { height: 20px; background: var(--recessed); position: relative; margin-top: 4px; }
  #b-regua i { position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--accent); }
  #b-dica { color: var(--muted); font-size: 9.5px; margin-top: auto; }
  #rack { position: sticky; top: 0; display: block; }
  .espaco { position: absolute; top: 0; left: 0; width: 1px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <div class="marca"><svg id="logo" width="118" height="15" viewBox="6.63 12.62 258.74 30.75" aria-label="RASGO"></svg><span>MODULAR</span></div>
  <div class="grupo">
    <input id="seed" type="text" inputmode="numeric" maxlength="20" value="4303935450909092226" aria-label="Número da seed" />
    <button id="b-tocar" class="tocar">TOCAR</button>
    <button data-acao="seed" title="g">SEED</button>
    <button data-acao="repor" title="r">REPOR</button>
  </div>
  <div class="regua"></div>
  <div class="grupo">
    <span id="r-varia" class="rotulo vivo" title="v">VARIA</span>
    <div id="t-varia" class="trilho" tabindex="0"><div class="cheio"></div><div class="meio"></div></div>
    <button data-acao="mudar" title="m">MUDA</button>
    <button data-acao="evoluir" title="e">EVOLUI</button>
    <button data-acao="cruzar" title="c">CRUZA</button>
  </div>
  <div class="regua"></div>
  <div class="grupo">
    <button data-acao="banco" title="Ctrl+B">BANCO</button>
    <button data-acao="salvar" title="Ctrl+S">SALVA</button>
    <button data-acao="abrir" title="Ctrl+O">ABRIR</button>
  </div>
  <div class="regua"></div>
  <div class="grupo">
    <button data-acao="desfazer" title="Ctrl+Z">DESFAZ</button>
    <button data-acao="descabear" title="n">DESCABEIA</button>
    <button data-acao="espera" id="b-espera">ESPERA</button>
  </div>
  <div class="regua"></div>
  <div class="grupo">
    <span class="rotulo">ZOOM</span>
    <button data-acao="zoomMenos" title="Ctrl+−">−</button>
    <button data-acao="zoomMais" title="Ctrl+=">+</button>
    <button data-acao="vista" id="b-vista" class="prata">RACK · TODOS</button>
    <button data-acao="compacto" id="b-compacto" class="prata">COMPACTO</button>
  </div>
  <div class="grupo direita">
    <div id="vu"><div></div></div>
    <span class="rotulo" id="r-volume">VOLUME</span>
    <div id="t-volume" class="trilho" tabindex="0"><div class="cheio"></div></div>
    <button data-acao="rec" id="b-rec">● REC</button>
    <button data-acao="abre" id="b-abre" class="prata">ABRE · SEED</button>
    <button data-acao="lingua" id="b-lingua">PT</button>
    <button data-acao="tutorial" id="b-tutorial">TUTORIAL</button>
    <button data-acao="sobre" id="b-sobre">SOBRE</button>
  </div>
  <input id="arquivo" type="file" accept=".rmp,text/plain" hidden />
</header>
<div id="corpo">
  <nav id="paleta" aria-label="Módulos">
    <div id="lista"></div>
    <section id="learn" tabindex="-1" aria-live="polite">
      <div class="topo">LEARN<button id="b-leitura" title="F2">Aa (F2)</button></div>
      <div class="corpo" id="learn-corpo"></div>
      <div class="dica" id="learn-dica">F1: LEARN</div>
    </section>
  </nav>
  <div id="leitura-menu" role="menu"></div>
  <div id="direita">
  <div id="creditos"><span id="leitura"></span><span id="credito"></span></div>
  <div id="rolagem">
    <div class="espaco"></div>
    <canvas id="rack"></canvas>
  </div>
  </div>
</div>
<div id="sobrepor" role="dialog">
  <div class="cartao">
    <button id="o-fechar">FECHAR</button>
    <h2 id="o-titulo"></h2>
    <p id="o-sub"></p>
    <div id="o-corpo" tabindex="-1"></div>
  </div>
</div>
<div id="banco" role="dialog" aria-label="Banco de escalas">
  <div class="cartao">
    <h2><span id="b-titulo"></span> <button id="b-fechar" aria-label="×">×</button></h2>
    <input id="b-busca" type="text" />
    <div class="listas">
      <div id="b-familias" class="lista"></div>
      <div id="b-escalas" class="lista"></div>
    </div>
    <div id="b-conta"></div>
    <div id="b-info"><b id="b-nome"></b><span id="b-graus"></span><span id="b-fonte" class="fonte"></span>
      <div id="b-regua"></div>
      <span id="b-dica"></span></div>
  </div>
</div>
<script type="module">
import { Rack, corFamilia } from './rack.js';
import { web, temWeb, linguaInicial, ROTULO_LINGUA as ROTULO_L } from './textos.js';
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
let ctx = null, no = null, bytes = null, local = null;   // local: o motor na página (marca, catálogo, banco)
const rack = new Rack($('rack'), $('rolagem'));
// Antes de o som estar pronto, os gestos no rack (cabos, knobs) ficam numa
// fila e são aplicados ao motor que toca logo depois da seed: sem isto, um
// cabo feito antes do TOCAR, ou no instante em que o som carrega, sumia
// (relato do autor, 26/11: "tento cabear e não cabeiam")
const fila = [];
rack.enviar = (msg) => fila.push(msg);
// COMPACTO (a vista compacta dos painéis, src/ui/CompactPanel.hpp, a mesma
// regra do app) e `?cabos=` (opacidade dos cabos, para comparar; o padrão é 0,5)
let compacto = q.has('estreito') || (() => { try { return localStorage.getItem('rasgoModular.compacto') === '1'; } catch { return false; } })();
if (q.has('cabos')) rack.opacidade = Math.min(1, Math.max(0.1, Number(q.get('cabos')) || 1));
rack.layout();

// ---- estado do cabeçalho ------------------------------------------------
const est = { seed: $('seed').value, cabos: 0, espera: false, variaOn: true, variaAmt: 1,
              volume: 0.7, avisoAte: 0, aviso: '' };
const guardar = (k, v) => { try { localStorage.setItem('rasgoModular.' + k, v); } catch { /* sem armazenamento */ } };
const ler = (k) => { try { return localStorage.getItem('rasgoModular.' + k); } catch { return null; } };

// ---- os idiomas ----------------------------------------------------------
// Os textos do app vêm do motor (`rw_textos`, UiLanguage.hpp); os da página,
// de textos.js. L: 0 en, 1 pt, 2 fr, 3 es.
let L = linguaInicial(ler('lingua'));
let TX = {};
const tx = (k) => TX[k] ?? k;
const W = (k, v) => web(k, L, v);
rack.tx = tx;
function carregarTextos() {
  if (!local) return;
  TX = JSON.parse(cTexto(local, local.rw_textos(L)));
  local.rw_lingua(L);
  if (no) no.port.postMessage({ tipo: 'lingua', l: L });
  aplicarTextos();
}
const ROTULOS = { seed: 'hdrSeed', repor: 'hdrRestore', mudar: 'hdrChange', evoluir: 'hdrEvolve', cruzar: 'hdrCross',
                  banco: 'hdrBank', salvar: 'hdrSave', abrir: 'hdrOpen', desfazer: 'hdrUndo', descabear: 'hdrUncable',
                  espera: 'hdrStandby', tutorial: 'hdrTutorial', sobre: 'hdrAbout' };
function aplicarTextos() {
  document.documentElement.lang = ['en', 'pt-BR', 'fr', 'es'][L];
  for (const [a, k] of Object.entries(ROTULOS)) document.querySelector(`[data-acao="${a}"]`).textContent = tx(k);
  $('r-varia').textContent = tx('hdrVary');
  $('b-tocar').textContent = W('tocar');
  $('r-volume').textContent = W('volume');
  $('b-lingua').textContent = ROTULO_L[L];
  $('credito').textContent = tx('footerCredit') + versao().replace(' ', '  ·  ');
  relogioRec();
  $('b-titulo').textContent = tx('scaleBankTitle');
  $('b-busca').placeholder = tx('scaleBankSearch');
  $('b-dica').textContent = tx('scaleBankHint');
  if ($('banco').classList.contains('aberto')) listarBanco();
  if ($('sobrepor').classList.contains('aberto')) sobrepor(sobreporModo);
  learn.mostrado = null; learn.chave = '';
  mostrarLearn();
  syncCabecalho();
}
const versao = () => (local ? cTexto(local, local.rw_versao()) : '');

// avisos na caixa LEARN, por 6 s (`PaletteColumn::setNotice`)
function aviso(t, ms = 6000) { est.aviso = t; est.avisoAte = performance.now() + ms; mostrarLearn(); }
rack.aviso = (t) => aviso(t);

function leitura() {
  const el = $('leitura');
  const mods = rack.soSaida ? `${rack.vistos.length}/${rack.mods.length}` : `${rack.vistos.length}`;
  el.textContent = no ? `${mods} ${tx('rdModules')}  ·  ${est.cabos} ${tx('rdCables')}` : '';
}
setInterval(leitura, 500);

// o realce de um instante no botão da ação (`flashing`, 160 ms)
function acende(acao) {
  const b = document.querySelector(`[data-acao="${acao}"]`);
  if (!b || b.id === 'b-espera' || b.id === 'b-vista' || b.id === 'b-compacto') return;
  b.classList.add('on');
  setTimeout(() => b.classList.remove('on'), 160);
}

function trilho(el, frac) { el.querySelector('.cheio').style.width = Math.round(frac * 82) + 'px'; }
function syncCabecalho() {
  if (document.activeElement !== $('seed')) $('seed').value = est.seed === '0' ? '' : est.seed;
  document.querySelector('[data-acao="repor"]').hidden = est.seed === '0';
  $('b-tocar').hidden = !!no;
  $('b-espera').classList.toggle('on', est.espera);
  $('b-vista').classList.toggle('on', rack.soSaida);
  $('b-compacto').classList.toggle('on', compacto);
  $('b-compacto').textContent = W('compacto');
  $('b-vista').textContent = 'RACK · ' + tx(rack.soSaida ? 'hdrRackOut' : 'hdrRackAll');
  trilho($('t-varia'), est.variaOn ? est.variaAmt * 0.5 : 0);
  $('r-varia').classList.toggle('vivo', est.variaOn && est.variaAmt > 0);
  trilho($('t-volume'), est.volume);
  const modo = ler('abre') || 'seed';
  $('b-abre').textContent = tx('hdrOpens') + ' · ' + tx({ seed: 'startSeed', uncabled: 'startUncabled', init: 'startInit', last: 'startLast' }[modo]);
  leitura();
}

// ---- o motor ------------------------------------------------------------
fetch('rasgo.wasm').then(r => r.arrayBuffer()).then(async (b) => {
  bytes = b;
  // a marca RASGO do cabeçalho vem do motor (o mesmo vetor dos painéis)
  const e = local = await instanciar();
  construirPaleta(JSON.parse(cTexto(e, e.rw_catalogo())));
  // `?lingua=0..3` e `?abrir=tutorial|sobre`: capturas de teste
  if (q.has('lingua')) L = Math.min(3, Math.max(0, Number(q.get('lingua')) | 0));
  carregarTextos();
  if (q.has('abrir')) sobrepor(q.get('abrir'));
  const wp = e.rw_wordmark(), u8 = new Uint8Array(e.memory.buffer); let fim = wp; while (u8[fim]) fim++;
  $('logo').innerHTML = `<path fill="#d8dde6" d="${new TextDecoder().decode(u8.slice(wp, fim))}"/>`;
  aviso(W('pronto'), 1e9);
  if (!q.has('previa')) mostrarAntes();
  if (q.has('auto')) tocar();
  if (q.has('previa')) previa().catch((x) => aviso('Erro na prévia: ' + x + ' ' + (x.stack || '').split('\n')[1], 1e9));
}).catch(() => aviso(W('semWasm'), 1e9));

// um texto terminado em zero na memória do motor
function cTexto(e, p) {
  const u8 = new Uint8Array(e.memory.buffer); let f = p; while (u8[f]) f++;
  return new TextDecoder().decode(u8.slice(p, f));
}

async function instanciar() {
  let mem;
  const stub = new Proxy({}, { get: (_, n) => (...a) => {
    if (n === 'fd_write') { const v = new DataView(mem.buffer); let s = 0;
      for (let k = 0; k < a[2]; k++) s += v.getUint32(a[1] + 8 * k + 4, true); v.setUint32(a[3], s, true); }
    return 0; } });
  const { instance } = await WebAssembly.instantiate(bytes, { wasi_snapshot_preview1: stub, env: stub });
  const e = instance.exports; mem = e.memory; if (e._initialize) e._initialize();
  return e;
}

async function ligar() {
  if (ctx) return;
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule('rasgo-worklet.js');
  const n = new AudioWorkletNode(ctx, 'rasgo', { numberOfInputs: 1, outputChannelCount: [2] });
  n.connect(ctx.destination);
  await new Promise(ok => {
    n.port.onmessage = (ev) => {
      const m = ev.data;
      if (m.tipo === 'pronto') ok();
      // seed nova, DESFAZ, REPOR, ABRIR: patch novo; 'rack': os cabos mudaram;
      // 'redesenho': o mesmo patch com outra vista (o COMPACTO)
      if (m.tipo === 'seed' || m.tipo === 'patch' || m.tipo === 'rack' || m.tipo === 'redesenho') {
        est.seed = m.seed; est.cabos = m.cabos;
        rack.carregar(m.texto, m.wordmark, m.tipo === 'redesenho' ? 'manter' : m.tipo === 'rack');
        // módulo novo: à vista na SAÍDA por exceção, até chegar ao som
        if (m.novo >= 0 && !rack.porId.get(m.novo)?.chega) { rack.pendentes.add(m.novo); rack.layout(); }
        syncCabecalho();
      }
      if (m.tipo === 'quadro') {
        est.lufs = m.lufs;
        if (m.entrada !== est.entrada) { est.entrada = m.entrada; entradas(m.entrada); }
        if ((m.rec >= 0) !== (est.rec >= 0) || Math.floor(m.rec) !== Math.floor(est.rec)) { est.rec = m.rec; relogioRec(); }
        if (m.learnValor !== learn.valor) { learn.valor = m.learnValor; if (learn.mostrado?.param) mostrarLearn(); }
        rack.quadro(m.valores, m.cabos, m.ids, m.visores, m.escalas, m.luzes);
        est.cabos = m.cabos.length / 14;
        // o VU do cabeçalho (`setReadout`): pico contra −1 dBFS
        const f = Math.min(1, m.vu / 0.891), vu = $('vu').firstChild;
        vu.style.width = Math.round(f * 54) + 'px';
        vu.style.background = f < 0.85 ? 'var(--prata)' : 'var(--warning)';
      }
      if (m.tipo === 'salvo') salvo(m);
      if (m.tipo === 'recAudio') est.tomada.push(m.bloco);
      if (m.tipo === 'recFim') { est.rec = -1; relogioRec(); arquivosRec(m); }
      if (m.tipo === 'recusa') aviso(m.modulo + (m.motivo === -1 ? tx('instanceSingle') : m.motivo === -2 ? tx('instanceMax') : W('tipoDesconhecido')));
      if (m.tipo === 'bancoAtual') abrirBanco(m.id, Math.round(m.banco));
      if (m.tipo === 'nada' && m.acao === 'desfazer') aviso(W('nadaDesfazer'));
      if (m.tipo === 'nada' && m.acao === 'abrir') aviso(W('abrirFalhou'));
    };
    n.port.postMessage({ tipo: 'wasm', bytes });
  });
  no = n;
  // (rack.enviar continua na fila até a seed ser montada: ver tocar1)
  // a lista dos visores na tela foi calculada antes de haver motor: reenviar
  rack.idsVisiveis = ''; rack.redesenhar();
  no.port.postMessage({ tipo: 'ganho', valor: est.volume });
  if (compacto) no.port.postMessage({ tipo: 'compacto', ligado: true });
  enviarVaria();
  if (est.espera) no.port.postMessage({ tipo: 'espera', ligada: true });
}

// Antes do primeiro clique o navegador não deixa soar, mas o rack já
// aparece: o motor da página monta o mesmo patch que o TOCAR vai tocar (a
// seed da caixa, ou o patch guardado pelo ABRE) e o desenha parado.
// Segurança da abertura (`StartupPolicy`, como no app): a página marca que
// está aberta e desmarca ao fechar normalmente; se a marca já estava lá, a
// sessão anterior caiu — e o patch dela (ÚLTIMA, MEU PATCH) pode ser a
// causa: abre sem cabos, com aviso
const caiu = ler('aberta') === '1';
guardar('aberta', '1');
addEventListener('pagehide', () => guardar('aberta', '0'));
function mostrarAntes() {
  const e = local;
  e.rw_iniciar(48000);
  e.rw_compacto(compacto ? 1 : 0);
  const modo = caiu ? 'uncabled' : (ler('abre') || 'seed');
  const guardado = modo === 'init' ? ler('init') : modo === 'last' ? ler('sessao') : null;
  let aberto = false;
  if (guardado) {
    const b = new TextEncoder().encode(guardado);
    new Uint8Array(e.memory.buffer, e.rw_entrada(b.length), b.length).set(b);
    aberto = !!e.rw_abrir(b.length);
  }
  if (!aberto) {
    const s = BigInt(seedValida() || '4303935450909092226');
    e.rw_seed(Number(s >> 32n), Number(s & 0xffffffffn));
    if (modo === 'uncabled') e.rw_descabear();
  }
  const texto = new TextDecoder().decode(new Uint8Array(e.memory.buffer, e.rw_descrever(), e.rw_texto_tamanho()).slice());
  rack.carregar(texto, cTexto(e, e.rw_wordmark()));
  rack.quadro(new Float32Array(e.memory.buffer, e.rw_valores(), e.rw_num_controles()).slice(),
              new Float32Array(e.memory.buffer, e.rw_cabos_estado(), e.rw_cabos() * 14).slice());
  est.cabos = e.rw_cabos();
}

// O primeiro clique liga o som e abre como o ABRE manda (`StartupPolicy`):
// SEED = a seed da caixa; SEM CABOS = ela, descabeada; MEU PATCH e ÚLTIMA =
// o patch guardado neste navegador (se não houver, a seed)
// uma partida só, mesmo se o primeiro clique e um comando chegarem juntos
let partida = null;
function tocar() {
  if (no) return Promise.resolve();
  return partida ||= tocar1();
}
async function tocar1() {
  const s = seedValida() || '4303935450909092226';
  aviso(W('montando'), 1e9);
  await ligar();
  await ctx.resume();
  const modo = caiu ? 'uncabled' : (ler('abre') || 'seed');
  const guardado = modo === 'init' ? ler('init') : modo === 'last' ? ler('sessao') : null;
  if (guardado) no.port.postMessage({ tipo: 'abrir', texto: guardado });
  else {
    no.port.postMessage({ tipo: 'seed', seed: s });
    if (modo === 'uncabled') no.port.postMessage({ tipo: 'descabear' });
  }
  // o que se fez no rack enquanto o som carregava, na mesma ordem
  for (const msg of fila.splice(0)) no.port.postMessage(msg);
  rack.enviar = (msg) => no.port.postMessage(msg);
  est.avisoAte = 0; mostrarLearn();
  if (caiu && (ler('abre') === 'init' || ler('abre') === 'last')) aviso(tx('startNoteSafe'), 12000);
  syncCabecalho();
}

const sorteio = () => { const a = new Uint32Array(2); crypto.getRandomValues(a); return [a[0], a[1]]; };
function novaSeed() {
  const [a, b] = sorteio();
  let s = (BigInt(a) << 32n) | BigInt(b); if (s === 0n) s = 1n;
  return s.toString();
}
function seedValida() {
  const s = $('seed').value.trim();
  return /^\d{1,20}$/.test(s) && BigInt(s) > 0n && BigInt(s) < (1n << 64n) ? s : null;
}
function enviarVaria() {
  if (no) no.port.postMessage({ tipo: 'varia', ligado: est.variaOn && est.variaAmt > 0, intensidade: est.variaAmt });
}

// ---- as ações (o despacho único do app: clique e atalho entram por aqui)
async function acao(a) {
  acende(a);
  if (a === 'zoomMenos' || a === 'zoomMais' || a === 'zoom0') { rack.mudarZoom(a === 'zoom0' ? 0 : a === 'zoomMais' ? 1 : -1); return; }
  if (a === 'vista') {
    rack.vistaSaida(!rack.soSaida); syncCabecalho();
    aviso(W(rack.soSaida ? 'vistaSaida' : 'vistaTodos') + `${rack.vistos.length}/${rack.mods.length}`);
    return;
  }
  if (a === 'abre') {
    const ordem = ['seed', 'uncabled', 'init', 'last'];
    const modo = ordem[(ordem.indexOf(ler('abre') || 'seed') + 1) % 4];
    guardar('abre', modo);
    if (modo === 'init' && no) no.port.postMessage({ tipo: 'salvar', destino: 'init' });
    aviso({ seed: W('abreSeed'), uncabled: tx('startNoteUncabled'), init: tx('startNoteInit'), last: W('abreUltima') }[modo], 7000);
    syncCabecalho();
    return;
  }
  if (a === 'abrir') { $('arquivo').click(); return; }
  if (a === 'rec') {
    if (!no) await tocar();
    if (est.rec >= 0) no.port.postMessage({ tipo: 'rec', ligar: false });
    else { est.tomada = []; est.rec = 0; relogioRec(); no.port.postMessage({ tipo: 'rec', ligar: true }); }
    return;
  }
  // COMPACTO: os painéis com as regras do plugin VCV (knobs em três
  // tamanhos, fileiras aproximadas, painel estreitado), à escolha de quem toca
  if (a === 'compacto') {
    compacto = !compacto;
    guardar('compacto', compacto ? '1' : '0');
    if (no) no.port.postMessage({ tipo: 'compacto', ligado: compacto });   // o motor que toca manda o rack
    else if (local) { local.rw_compacto(compacto ? 1 : 0); mostrarAntes(); }
    syncCabecalho();
    return;
  }
  if (a === 'lingua') { L = (L + 1) % 4; guardar('lingua', String(L)); carregarTextos(); return; }
  if (a === 'tutorial' || a === 'sobre') {
    if ($('sobrepor').classList.contains('aberto') && sobreporModo === a) fecharSobrepor(); else sobrepor(a);
    return;
  }
  if (a === 'variaLiga') { est.variaOn = !est.variaOn; enviarVaria(); syncCabecalho(); return; }
  if (a === 'espera') {
    est.espera = !est.espera; syncCabecalho();
    rack.silenciado = est.espera; rack.redesenhar();
    if (no) no.port.postMessage({ tipo: 'espera', ligada: est.espera });
    return;
  }
  // toda seed abre em RACK · SAÍDA (autor, 26/11/2026: "que o seed abra em
  // rack output por padrão"); durante o uso o RACK alterna à vontade
  if (a === 'seed' || a === 'repor') { rack.vistaSaida(true); syncCabecalho(); }
  if (a === 'seed') {
    const s = novaSeed();
    $('seed').value = s;
    if (!no) { await tocar(); return; }
    no.port.postMessage({ tipo: 'seed', seed: s });
    return;
  }
  if (!no) await tocar();
  if (a === 'repor') no.port.postMessage({ tipo: 'repor' });
  else if (a === 'mudar') no.port.postMessage({ tipo: 'mudar', s: sorteio() });
  else if (a === 'evoluir') no.port.postMessage({ tipo: 'evoluir', s: sorteio() });
  else if (a === 'cruzar') no.port.postMessage({ tipo: 'cruzar', s: [...sorteio(), ...sorteio()] });
  else if (a === 'desfazer') no.port.postMessage({ tipo: 'desfazer' });
  else if (a === 'descabear') no.port.postMessage({ tipo: 'descabear' });
  else if (a === 'romperTodos') no.port.postMessage({ tipo: 'romperTodos' });
  else if (a === 'salvar' || a === 'banco') no.port.postMessage({ tipo: 'salvar', destino: a });
}

// ---- ENTRADAS: microfone e MIDI ----------------------------------------------
// A regra do app (`syncSignalIn`): o microfone só é pedido quando um
// SIGNAL-IN com o ON ligado tem uma saída cabeada; o MIDI, também para o
// POLY-IN. Cortar o cabo ou desligar o ON fecha de novo. O navegador pede a
// permissão nessa hora, nunca ao abrir a página. Sem cancelamento de eco nem
// redução de ruído: o sinal chega cru, como da placa.
est.entrada = 0;
let mic = null, micFonte = null, midiAcesso = null, pedindoMic = false;
async function entradas(pede) {
  if ((pede & 1) && !mic && !pedindoMic) {
    pedindoMic = true;
    try {
      mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      if (est.entrada & 1) { micFonte = ctx.createMediaStreamSource(mic); micFonte.connect(no); }
      else { mic.getTracks().forEach((t) => t.stop()); mic = null; }
    } catch { aviso(W('semMic')); }
    pedindoMic = false;
  } else if (!(pede & 1) && mic) {
    if (micFonte) micFonte.disconnect();
    mic.getTracks().forEach((t) => t.stop());
    mic = null; micFonte = null;
  }
  if ((pede & 2) && !midiAcesso) {
    if (!navigator.requestMIDIAccess) { aviso(W('semMidi')); midiAcesso = 'nenhum'; return; }
    try {
      midiAcesso = await navigator.requestMIDIAccess();
      const liga = () => { for (const i of midiAcesso.inputs.values()) i.onmidimessage = (ev) => { if (no && (est.entrada & 2)) no.port.postMessage({ tipo: 'midi', d: Array.from(ev.data) }); }; };
      liga(); midiAcesso.onstatechange = liga;   // teclado ligado depois também entra
    } catch { aviso(W('semMidi')); midiAcesso = 'nenhum'; }
  }
}

// ---- REC ------------------------------------------------------------------
// O botão é o relógio da tomada (`● REC 01:23`; no último meio minuto,
// `/ 04:00`); ao parar, a página monta os arquivos com o código do app
// (rasgo_rec.cpp) e os baixa: o WAV de 24 bits, a versão de entrega a
// -14 LUFS (.streaming.wav + .txt), a partitura (.score.txt) e, se houve
// notas no NOTE-OUT, o .mid. Nada sai do navegador.
est.rec = -1; est.tomada = [];
const mmss = (t) => { t = Math.max(0, Math.floor(t)); return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
function relogioRec() {
  const b = $('b-rec');
  b.classList.toggle('gravando', est.rec >= 0);
  b.textContent = '● ' + tx('hdrRec') + (est.rec >= 0 ? ' ' + mmss(est.rec) + (est.rec >= 210 ? ' / 04:00' : '') : '');
}
function baixar(nome, dados, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([dados], { type: tipo }));
  a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// a montagem roda num Worker (`rasgo-rec-worker.js`): na página ela segurava
// as animações por alguns segundos depois de parar (autor, 27/11/2026)
let recWorker = null;
function montarNoWorker(dados, trans) {
  if (!recWorker) recWorker = new Worker('rasgo-rec-worker.js');
  else dados.bytes = null;   // o worker já tem o motor (só a primeira tomada leva os bytes)
  return new Promise((ok) => { recWorker.onmessage = (ev) => ok(ev.data); recWorker.postMessage(dados, trans); });
}
async function arquivosRec(m) {
  const blocos = est.tomada; est.tomada = [];
  const total = blocos.reduce((n, b) => n + b.length, 0);
  if (!total || !bytes) return;
  aviso(W('recMontando'), 1e9);
  const r = await montarNoWorker({ bytes, blocos, taxa: m.taxa, nome: m.nome }, blocos.map((b) => b.buffer));
  const arquivos = [];
  if (r.wav) { baixar(m.nome + '.wav', r.wav, 'audio/wav'); arquivos.push(m.nome + '.wav'); }
  if (r.entrega) {
    baixar(m.nome + '.streaming.wav', r.entrega, 'audio/wav');
    baixar(m.nome + '.streaming.txt', r.medidas, 'text/plain');
    arquivos.push(m.nome + '.streaming.wav', m.nome + '.streaming.txt');
  }
  baixar(m.nome + '.score.txt', m.partitura, 'text/plain'); arquivos.push(m.nome + '.score.txt');
  if (m.midi.length) { baixar(m.nome + '.mid', m.midi, 'audio/midi'); arquivos.push(m.nome + '.mid'); }
  aviso(W('recPronto', { arquivos: arquivos.join(', ') }), 9000);
}

// SALVA guarda a sessão neste navegador; BANCO baixa o patch num arquivo
// com o nome da seed (`bankPatchName`: seed-N.rmp, ou patch-<hora>.rmp)
function salvo(m) {
  if (m.destino === 'salvar') { guardar('sessao', m.texto); aviso(W('salvoAqui')); }
  else if (m.destino === 'init') guardar('init', m.texto);
  else if (m.destino === 'ultima') guardar('sessao', m.texto);
  else if (m.destino === 'banco') {
    const nome = m.seed !== '0' ? `seed-${m.seed}.rmp` : `patch-${Math.floor(Date.now() / 1000)}.rmp`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([m.texto], { type: 'text/plain' }));
    a.download = nome; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    aviso(W('noBanco', { nome }));
  }
}
// ABRE · ÚLTIMA: a sessão vai sendo guardada enquanto se toca
setInterval(() => { if (no && ler('abre') === 'last') no.port.postMessage({ tipo: 'salvar', destino: 'ultima' }); }, 5000);

$('arquivo').onchange = async () => {
  const f = $('arquivo').files[0];
  $('arquivo').value = '';
  if (!f) return;
  if (f.size > 4e6) { aviso(W('grande')); return; }
  const texto = await f.text();
  if (!no) await tocar();
  no.port.postMessage({ tipo: 'abrir', texto });
};

// ---- os controles do cabeçalho -------------------------------------------
$('b-tocar').onclick = () => tocar();
// O navegador só deixa soar depois de um gesto: o PRIMEIRO clique ou tecla,
// em qualquer lugar da página, liga o som (autor, 25/11) — e o clique ainda
// faz o que faria (girar o knob, abrir a paleta…). Não liga se for o TOCAR
// (ele mesmo liga) nem se o motor ainda não carregou.
function primeiroGesto(ev) {
  if (no || !bytes) return;
  if (ev.target === $('b-tocar')) return;
  removeEventListener('pointerdown', primeiroGesto, true);
  removeEventListener('keydown', primeiroGesto, true);
  tocar();
}
addEventListener('pointerdown', primeiroGesto, true);
addEventListener('keydown', primeiroGesto, true);
for (const b of document.querySelectorAll('header button[data-acao]')) b.onclick = () => acao(b.dataset.acao);
$('r-varia').onclick = () => acao('variaLiga');
$('seed').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') {
    const s = seedValida();
    if (!s) { aviso(W('seedInvalida')); return; }
    $('seed').blur();

// arrastar no trilho: clicar em qualquer ponto salta para lá (`setVaryFromX`)
function arrastoTrilho(el, aplicar) {
  const em = (ev) => { const r = el.getBoundingClientRect(); aplicar(Math.min(1, Math.max(0, (ev.clientX - r.left - 1) / (r.width - 2)))); };
  el.addEventListener('pointerdown', (ev) => { el.setPointerCapture(ev.pointerId); em(ev); });
  el.addEventListener('pointermove', (ev) => { if (el.hasPointerCapture(ev.pointerId)) em(ev); });
}
arrastoTrilho($('t-varia'), (f) => { est.variaAmt = f * 2; est.variaOn = true; enviarVaria(); syncCabecalho(); });
arrastoTrilho($('t-volume'), (f) => {
  est.volume = f; syncCabecalho();
  if (no) no.port.postMessage({ tipo: 'ganho', valor: f });
});

// ---- a paleta -------------------------------------------------------------
// Arrastar um tipo para o rack acrescenta o módulo; parar o mouse num tipo
// acende os módulos dele no rack; um módulo arrastado pelo título e solto
// aqui sai da case.
function construirPaleta(cat) {
  const nav = $('lista');
  for (const f of cat) {
    const h = document.createElement('h3');
    h.style.color = corFamilia(f.familia);
    h.innerHTML = `<i style="background:${corFamilia(f.familia)}"></i>`;
    h.append(f.familia);
    const ul = document.createElement('ul');
    for (const t of f.tipos) {
      const li = document.createElement('li');
      li.textContent = t; li.dataset.tipo = t;
      ul.append(li);

    return;
  }
  // as setas rolam o rack
  const rolar = { ArrowUp: -60, ArrowDown: 60, PageUp: -0.9, PageDown: 0.9 }[ev.key];
  if (rolar !== undefined && !ev.ctrlKey && !ev.altKey && ev.target === document.body) {
    ev.preventDefault();
    const r = $('rolagem');
    r.scrollTop += Math.abs(rolar) < 1 ? rolar * r.clientHeight : rolar;
    return;
  }
  // F6: o teclado vai para os botões do cabeçalho (e volta); lá, as setas
  // andam entre eles, Enter/espaço acionam e o LEARN explica o que está em
  // foco (`HeaderBar::focusCommands` do app)
  if (ev.key === 'F6') {
    ev.preventDefault();
    const bs = botoesCabecalho();
    if (bs.includes(document.activeElement)) document.activeElement.blur(); else bs[0]?.focus();
    return;
  }
  if (document.activeElement?.closest?.('header') && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
    const bs = botoesCabecalho(), i = bs.indexOf(document.activeElement);
    if (i >= 0) { ev.preventDefault(); bs[(i + (ev.key === 'ArrowRight' ? 1 : bs.length - 1)) % bs.length].focus(); }

    ev.preventDefault();
    const d = ev.key === 'ArrowUp' ? 0.05 : -0.05;
    if (document.activeElement.id === 't-varia') { est.variaAmt = Math.min(2, Math.max(0, est.variaAmt + d)); est.variaOn = true; enviarVaria(); }

    syncCabecalho();
    return;
  }
  if (document.activeElement?.closest?.('header') && document.activeElement.tagName === 'BUTTON') {

  if (q.has('descabear')) e.rw_descabear();
  const dec = new TextDecoder();
  const texto = dec.decode(new Uint8Array(mem.buffer, e.rw_descrever(), e.rw_texto_tamanho()).slice());
  const wp = e.rw_wordmark(), b = new Uint8Array(mem.buffer); let fim = wp; while (b[fim]) fim++;
  rack.carregar(texto, dec.decode(b.slice(wp, fim)));
  // `?so=TIPO,TIPO,…`: só esses módulos, nessa ordem (folhas da auditoria
  // de diagramação, tools/auditar_paineis.mjs)
  if (q.has('so')) {
    const tipos = q.get('so').split(',');
    rack.mods = tipos.map((t) => rack.mods.find((m) => m.tipo === t)).filter(Boolean);
    rack.layout();
  }
  // `?insp=N`: abre o inspetor do cabo N; com `&rel`, liga nele uma relação
  // RING (companion = a origem do cabo seguinte), para ver o selo
  if (q.has('insp')) {
    const n = Number(q.get('insp')) || 0;
    const c = new Float32Array(mem.buffer, e.rw_cabos_estado(), e.rw_cabos() * 14).slice();
    const d = c[n * 14 + 2], pd = c[n * 14 + 3];
    if (q.has('rel')) e.rw_cabo_relacao(d, pd, 1, c[(n + 1) * 14], c[(n + 1) * 14 + 1], 0.6);
    rack.insp = { d, pd };
  }
  for (let i = 0; i < seg * 48000 / 128; i++) e.rw_processar();
  const nc = e.rw_num_controles();
  // todos os visores (a prévia não rola): 748 números cada, como no worklet
  const ids = []; for (let k = 0; k < e.rw_num_visores(); k++) ids.push(e.rw_visor_id(k));
  const vis = new Float32Array(ids.length * 748), escalas = {};
  ids.forEach((id, k) => vis.set(new Float32Array(mem.buffer, e.rw_visor(id), 748), k * 748));
  for (const md of rack.mods)
    if (md.tipo === 'QUANTIZER' && vis[ids.indexOf(md.id) * 748 + 732] > 12.5) {
      const p = e.rw_nome_escala(md.id), bb = new Uint8Array(mem.buffer); let f = p; while (bb[f]) f++;
      escalas[md.id] = dec.decode(bb.slice(p, f));
    }
  if (q.has('espectro')) for (const md of rack.mods) if (md.tipo === 'SCOPE') rack.espectro.add(md.id);
  rack.quadro(new Float32Array(mem.buffer, e.rw_valores(), nc).slice(),
              new Float32Array(mem.buffer, e.rw_cabos_estado(), e.rw_cabos() * 14).slice(), ids, vis, escalas,
              new Float32Array(mem.buffer, e.rw_luzes(), e.rw_num_luzes()).slice());
  if (q.has('rolar')) { $('rolagem').scrollTop = q.get('rolar') === 'fim' ? 1e9 : Number(q.get('rolar')); rack.desenhar(); }
  const vu = Math.min(1, e.rw_vu() / 0.891);
  $('vu').firstChild.style.width = Math.round(vu * 54) + 'px';
  est.cabos = e.rw_cabos(); est.seed = String(s);
  // `?banco`: abre o banco de escalas do QUANTIZER (captura de teste)
  if (q.has('banco')) { local = e; const qz = rack.mods.find((m) => m.tipo === 'QUANTIZER'); abrirBanco(qz.id, Math.round(e.rw_parametro(qz.id, 0))); }
  if (q.has('paletaTipo')) rack.paletaTipo = q.get('paletaTipo');
  // `?puxar=TIPO.bind`: um cabo sendo puxado desse jack (captura dos halos)
  if (q.has('puxar')) {
    const [t, b] = q.get('puxar').split('.');
    const md = rack.mods.find((m) => m.tipo === t), w = md?.w.find((x) => x.b === b);
    const j = w && rack.jacks.get(`${md.id}:${w.p}:${w.out}`);
    if (j) { rack.gesto = { tipo: 'cabo', no: j.no, p: j.p, deSaida: !!j.out, pk: j.pk, ax: j.x, ay: j.y }; rack.mouse = { x: j.x + 260, y: j.y + 160 }; }
  }
  // `?learn=TIPO.bind` (ou só TIPO): mostra esse verbete na caixa
  if (q.has('learn')) {
    const [t, b] = q.get('learn').split('.');
    const md = rack.mods.find((m) => m.tipo === t);
    const w = b && md?.w.find((x) => x.b === b);
    const h = w ? { tipo: t, bind: b, titulo: `${t}  ·  ${w.l}`, param: true } : { tipo: t, modulo: true };
    learn.mostrado = { ...verbete(h), param: !!w };
    if (w) learn.valor = cTexto(e, e.rw_learn_valor(md.id, (() => { const bb = new TextEncoder().encode(b); new Uint8Array(e.memory.buffer, e.rw_entrada(bb.length), bb.length).set(bb); return bb.length; })()));
    mostrarLearn();
  }
  no = { port: { postMessage: () => {} } };   // a leitura e o cabeçalho como se tocasse
  est.avisoAte = 0; mostrarLearn(); syncCabecalho();
  if (q.has('medir')) {   // custo de um quadro (camada fixa já pronta)
    rack.desenhar();
    const t0 = performance.now();
    for (let i = 0; i < 60; i++) rack.desenhar();
    const t1 = performance.now();
    for (let i = 0; i < 20; i++) { rack.chaveCabos = null; rack.desenhar(); }
    aviso(`${rack.vistos.length} mód · quadro ${((t1 - t0) / 60).toFixed(2)} ms · com cabos mudando ${((performance.now() - t1) / 20).toFixed(2)} ms`, 1e9);
  }
  document.title += ' · pronto';
}

// a vista abre em RACK · SAÍDA (autor, 26/11/2026: "que o seed abra em rack
// output por padrão"); a escolha de quem toca fica guardada
rack.vistaSaida(!q.has('todos'));
aplicarLeitura();
syncCabecalho();
</script>
