<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rasgo Modular no navegador — protótipo</title>
<style>
  /* os tokens do app (`T` em RasgoModularApp.cpp) */
  :root { --bg: #131a1a; --surface: #262b36; --recessed: #0e1015; --line: #485060; --text: #f0f3f8;
          --muted: #bec8d8; --prata: #d8dde6; --accent: #ff9d4c; --warning: #ff6b5b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  /* O cabeçalho do app (`HeaderBar`): uma fileira de 46 px que quebra em
     duas quando não cabe; grupos separados por uma régua fina */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 6px; padding: 12px 12px 11px 14px;
           background: var(--bg); border-bottom: 1px solid var(--line); font: 9.5px system-ui, sans-serif; }
  .grupo { display: flex; align-items: center; gap: 6px; }
  .direita { margin-left: auto; }
  .marca { display: flex; align-items: center; gap: 7px; margin-right: 6px; padding-right: 10px;
           border-right: 1px solid var(--line); height: 26px; }
  .marca span { color: var(--muted); font-size: 9.5px; letter-spacing: .02em; }
  .regua { width: 1px; height: 16px; background: var(--line); margin: 0 3px 0 1px; }
  header button { height: 22px; padding: 0 7px; background: transparent; color: var(--muted);
                  border: 1px solid var(--line); border-radius: 0; font: inherit; cursor: pointer;
                  white-space: nowrap; }
  header button:hover { border-color: var(--muted); }
  /* ligado / o realce de um instante (`flashing`): cheio, com o anel */
  header button.on { background: var(--accent); border-color: var(--accent); color: var(--bg);
                     outline: 1px solid var(--accent); outline-offset: 2px; }
  header button.prata.on { background: var(--prata); border-color: var(--prata); outline-color: var(--prata); }
  header button.tocar { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .rotulo { color: var(--muted); }
  .rotulo.vivo { color: var(--text); }
  #r-varia { cursor: pointer; }
  #seed { width: 21ch; height: 22px; background: var(--recessed); color: var(--text); border: 1px solid var(--line);
          padding: 0 4px; font: 11px ui-monospace, monospace; border-radius: 0; }
  #seed:focus { outline: none; border-color: var(--accent); }
  /* slider do VARIA e do volume (`varySlider_`): 84 × 14, zero = desligado */
  .trilho { position: relative; width: 84px; height: 14px; background: var(--recessed); border-radius: 3px;
            cursor: pointer; touch-action: none; }
  .trilho .cheio { position: absolute; left: 1px; top: 1px; bottom: 1px; background: var(--prata); border-radius: 2px; }
  .trilho .meio { position: absolute; left: 42px; top: 2px; bottom: 2px; width: 1px; background: rgba(190, 200, 216, .7); }
  #leitura { color: var(--muted); font-size: 9.5px; white-space: nowrap; }
  #leitura.aviso { color: var(--text); white-space: normal; max-width: 46ch; }
  #vu { width: 54px; height: 8px; background: var(--recessed); position: relative; }
  #vu div { position: absolute; left: 0; top: 0; bottom: 0; background: var(--prata); }
  #corpo { flex: 1; display: flex; min-height: 0; }
  #rolagem { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; }
  /* a paleta (`PaletteColumn`): as famílias na cor delas, os tipos em 11 px;
     arrastar um tipo para o rack o acrescenta; um módulo solto aqui sai */
  #paleta { width: 186px; flex: none; display: flex; flex-direction: column; background: var(--bg);
            border-right: 1px solid var(--line); font: 9.5px system-ui, sans-serif; user-select: none; touch-action: none; }
  #lista { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 0 14px;
           scrollbar-width: thin; scrollbar-color: var(--line) var(--recessed); }
  /* a caixa LEARN, no pé da paleta: título, valor, e os três níveis do
     verbete (o que é · como funciona · → para experimentar) */
  #learn { flex: none; height: 232px; background: var(--recessed); border-top: 1px solid var(--line);
           display: flex; flex-direction: column; padding: 6px 8px 4px; user-select: text; outline: none;
           --lf: 10.3px; --lp: var(--text); --ls: var(--muted); --le: var(--prata); }
  #learn.foco { box-shadow: inset 0 0 0 1px var(--accent); }
  #learn.branco { --lp: #fff; --ls: #fff; --le: #fff; }
  #learn .topo { display: flex; align-items: center; color: var(--prata); font-size: 8.6px; height: 14px; }
  #learn .topo button { margin-left: auto; height: 18px; background: none; border: 0; color: var(--prata);
                        font: inherit; cursor: pointer; padding: 0 4px; }
  #learn .corpo { flex: 1; min-height: 0; overflow-y: auto; margin-top: 8px; font-size: var(--lf); line-height: 1.3;
                  scrollbar-width: thin; scrollbar-color: var(--line) var(--recessed); padding-right: 4px; }
  #learn .corpo p { margin: 0 0 7px; white-space: pre-line; }
  #learn .t { color: var(--le); font-weight: bold; margin-bottom: 5px; }
  #learn .v { color: var(--lp); }
  #learn .q { color: var(--lp); }
  #learn .u { color: var(--ls); }
  #learn .e { color: var(--le); }
  #learn .ocioso { color: var(--muted); }
  #learn .aviso { color: var(--accent); }
  #learn .dica { color: var(--muted); font-size: 8.6px; height: 13px; }
  #leitura-menu { position: fixed; z-index: 11; background: var(--surface); border: 1px solid var(--line);
                  font: 11px system-ui, sans-serif; min-width: 270px; padding: 4px 0; display: none; }
  #leitura-menu.aberto { display: block; }
  #leitura-menu div { padding: 6px 14px; color: var(--text); cursor: pointer; }
  #leitura-menu div:hover { background: rgba(255, 157, 76, .18); }
  #leitura-menu .cab { color: var(--muted); cursor: default; }
  #leitura-menu .cab:hover { background: none; }
  #leitura-menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  #paleta.alvo { outline: 1px solid var(--accent); outline-offset: -2px; }
  #paleta h3 { display: flex; align-items: center; gap: 4px; margin: 0; padding: 0 10px; height: 18px;
               font: inherit; font-weight: normal; }
  #paleta h3 i { width: 8px; height: 8px; display: inline-block; }
  #paleta li { list-style: none; padding-left: 18px; height: 15px; line-height: 15px; color: var(--muted);
               cursor: grab; }
  #paleta li:hover { color: var(--accent); }
  #paleta ul { margin: 0 0 4px; padding: 0; }
  /* o banco de escalas do QUANTIZER (`ScaleBrowser`) */
  #banco { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none; z-index: 10;
           align-items: center; justify-content: center; font: 11px system-ui, sans-serif; }
  #banco.aberto { display: flex; }
  #banco .cartao { width: min(820px, calc(100vw - 40px)); height: min(600px, calc(100vh - 40px));
                   background: var(--surface); border: 2px solid var(--line); display: flex; flex-direction: column;
                   padding: 10px 12px 12px; gap: 8px; }
  #banco h2 { margin: 0 4px; font: bold 13.5px system-ui, sans-serif; color: var(--text); display: flex; }
  #banco h2 button { margin-left: auto; background: none; border: 0; color: var(--text); font-size: 16px; cursor: pointer; }
  #banco input { height: 26px; background: var(--recessed); color: var(--text); border: 1px solid var(--line);
                 padding: 0 6px; font: 11px system-ui, sans-serif; margin: 0 4px; }
  #banco input:focus { outline: none; border-color: var(--accent); }
  #banco .listas { flex: 1; min-height: 0; display: flex; gap: 10px; }
  #banco .lista { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) var(--recessed); }
  #b-familias { width: 40%; border-right: 1px solid var(--line); }
  #b-escalas { flex: 1; }
  #banco .lista div { height: 22px; line-height: 22px; padding: 0 6px; color: var(--text); cursor: pointer;
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #banco .lista div:hover { color: var(--accent); }
  #banco .lista div.on { background: rgba(255, 157, 76, .18); color: var(--accent); }
  #b-conta { text-align: right; color: var(--muted); font-size: 9.5px; height: 12px; }
  #b-info { border-top: 1px solid var(--line); padding: 8px 4px 0; height: 124px; display: flex; flex-direction: column; gap: 3px; }
  #b-info b { color: var(--text); font-size: 11px; }
  #b-info .fonte { color: var(--muted); font-size: 9.5px; max-height: 26px; overflow: hidden; }
  #b-regua { height: 20px; background: var(--recessed); position: relative; margin-top: 4px; }
  #b-regua i { position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--accent); }
  #b-dica { color: var(--muted); font-size: 9.5px; margin-top: auto; }
  #rack { position: sticky; top: 0; display: block; }
  .espaco { position: absolute; top: 0; left: 0; width: 1px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <div class="marca"><svg id="logo" width="118" height="15" viewBox="6.63 12.62 258.74 30.75" aria-label="RASGO"></svg><span>MODULAR</span></div>
  <div class="grupo">
    <input id="seed" type="text" inputmode="numeric" maxlength="20" value="4303935450909092226" aria-label="Número da seed" />
    <button id="b-tocar" class="tocar" title="O navegador só deixa tocar depois de um clique">TOCAR</button>
    <button data-acao="seed" title="g">SEED</button>
    <button data-acao="repor" title="r">REPOR</button>
  </div>
  <div class="regua"></div>
  <div class="grupo">
    <span id="r-varia" class="rotulo vivo" title="v liga/desliga">VARIA</span>
    <div id="t-varia" class="trilho" title="Intensidade da variação (0 = desligado; a marca é o 1,0)"><div class="cheio"></div><div class="meio"></div></div>
    <button data-acao="mudar" title="m">MUDA</button>
    <button data-acao="evoluir" title="e">EVOLUI</button>
    <button data-acao="cruzar" title="c">CRUZA</button>
  </div>
  <div class="regua"></div>
  <div class="grupo">
    <button data-acao="banco" title="Ctrl+B: baixa o patch (.rmp)">BANCO</button>
    <button data-acao="salvar" title="Ctrl+S: guarda a sessão neste navegador">SALVA</button>
    <button data-acao="abrir" title="Ctrl+O: abre um patch (.rmp)">ABRIR</button>
  </div>
  <div class="regua"></div>
  <div class="grupo">
    <button data-acao="desfazer" title="Ctrl+Z">DESFAZ</button>
    <button data-acao="descabear" title="n">DESCABEIA</button>
    <button data-acao="espera" id="b-espera">ESPERA</button>
  </div>
  <div class="regua"></div>
  <div class="grupo">
    <span class="rotulo">ZOOM</span>
    <button data-acao="zoomMenos" title="Ctrl+−">−</button>
    <button data-acao="zoomMais" title="Ctrl+=">+</button>
    <button data-acao="vista" id="b-vista" class="prata">RACK · TODOS</button>
  </div>
  <div class="grupo direita">
    <span id="leitura"></span>
    <div id="vu" title="O pico do MASTER"><div></div></div>
    <span class="rotulo">VOLUME</span>
    <div id="t-volume" class="trilho" title="O volume desta página"><div class="cheio"></div></div>
    <button data-acao="abre" id="b-abre" class="prata" title="Como a página abre na próxima vez">ABRE · SEED</button>
  </div>
  <input id="arquivo" type="file" accept=".rmp,text/plain" hidden />
</header>
<div id="corpo">
  <nav id="paleta" aria-label="Módulos">
    <div id="lista"></div>
    <section id="learn" tabindex="-1" aria-live="polite">
      <div class="topo">LEARN<button id="b-leitura" title="F2">Aa (F2)</button></div>
      <div class="corpo" id="learn-corpo"></div>
      <div class="dica" id="learn-dica">F1: LEARN</div>
    </section>
  </nav>
  <div id="leitura-menu" role="menu"></div>
  <div id="rolagem">
    <div class="espaco"></div>
    <canvas id="rack"></canvas>
  </div>
</div>
<div id="banco" role="dialog" aria-label="Banco de escalas">
  <div class="cartao">
    <h2>ESCALAS — banco do Trioio <button id="b-fechar" aria-label="Fechar">×</button></h2>
    <input id="b-busca" type="text" placeholder="buscar" />
    <div class="listas">
      <div id="b-familias" class="lista"></div>
      <div id="b-escalas" class="lista"></div>
    </div>
    <div id="b-conta"></div>
    <div id="b-info"><b id="b-nome"></b><span id="b-graus"></span><span id="b-fonte" class="fonte"></span>
      <div id="b-regua"></div>
      <span id="b-dica">Clique numa escala: o QUANTIZER passa a tocá-la (SCALE = BANCO). Esc fecha.</span></div>
  </div>
</div>
<script type="module">
import { Rack, corFamilia } from './rack.js';
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
let ctx = null, no = null, bytes = null, local = null;   // local: o motor na página (marca, catálogo, banco)
const rack = new Rack($('rack'), $('rolagem'));
rack.layout();

// ---- estado do cabeçalho ------------------------------------------------
const est = { seed: $('seed').value, cabos: 0, espera: false, variaOn: true, variaAmt: 1,
              volume: 0.7, avisoAte: 0, aviso: '' };
const guardar = (k, v) => { try { localStorage.setItem('rasgoModular.' + k, v); } catch { /* sem armazenamento */ } };
const ler = (k) => { try { return localStorage.getItem('rasgoModular.' + k); } catch { return null; } };

// avisos na caixa LEARN, por 6 s (`PaletteColumn::setNotice`)
function aviso(t, ms = 6000) { est.aviso = t; est.avisoAte = performance.now() + ms; mostrarLearn(); }
rack.aviso = (t) => aviso(t);

function leitura() {
  const el = $('leitura');
  const mods = rack.soSaida ? `${rack.vistos.length}/${rack.mods.length}` : `${rack.vistos.length}`;
  el.textContent = no ? `${mods} mód  ·  ${est.cabos} cabos` : '';
}
setInterval(leitura, 500);

// o realce de um instante no botão da ação (`flashing`, 160 ms)
function acende(acao) {
  const b = document.querySelector(`[data-acao="${acao}"]`);
  if (!b || b.id === 'b-espera' || b.id === 'b-vista') return;
  b.classList.add('on');
  setTimeout(() => b.classList.remove('on'), 160);
}

function trilho(el, frac) { el.querySelector('.cheio').style.width = Math.round(frac * 82) + 'px'; }
function syncCabecalho() {
  if (document.activeElement !== $('seed')) $('seed').value = est.seed === '0' ? '' : est.seed;
  document.querySelector('[data-acao="repor"]').hidden = est.seed === '0';
  $('b-tocar').hidden = !!no;
  $('b-espera').classList.toggle('on', est.espera);
  $('b-vista').classList.toggle('on', rack.soSaida);
  $('b-vista').textContent = 'RACK · ' + (rack.soSaida ? 'SAÍDA' : 'TODOS');
  trilho($('t-varia'), est.variaOn ? est.variaAmt * 0.5 : 0);
  $('r-varia').classList.toggle('vivo', est.variaOn && est.variaAmt > 0);
  trilho($('t-volume'), est.volume);
  const modo = ler('abre') || 'seed';
  $('b-abre').textContent = 'ABRE · ' + { seed: 'SEED', uncabled: 'SEM CABOS', init: 'MEU PATCH', last: 'ÚLTIMA' }[modo];
  leitura();
}

// ---- o motor ------------------------------------------------------------
fetch('rasgo.wasm').then(r => r.arrayBuffer()).then(async (b) => {
  bytes = b;
  // a marca RASGO do cabeçalho vem do motor (o mesmo vetor dos painéis)
  const e = local = await instanciar();
  construirPaleta(JSON.parse(cTexto(e, e.rw_catalogo())));
  mostrarLearn();
  const wp = e.rw_wordmark(), u8 = new Uint8Array(e.memory.buffer); let fim = wp; while (u8[fim]) fim++;
  $('logo').innerHTML = `<path fill="#d8dde6" d="${new TextDecoder().decode(u8.slice(wp, fim))}"/>`;
  aviso('Pronto. Aperte TOCAR — o navegador só deixa soar depois de um clique.', 1e9);
  if (!q.has('previa')) mostrarAntes();
  if (q.has('auto')) tocar();
  if (q.has('previa')) previa().catch((x) => aviso('Erro na prévia: ' + x + ' ' + (x.stack || '').split('\n')[1], 1e9));
}).catch(() => aviso('Não consegui carregar rasgo.wasm (abra por um servidor http).', 1e9));

// um texto terminado em zero na memória do motor
function cTexto(e, p) {
  const u8 = new Uint8Array(e.memory.buffer); let f = p; while (u8[f]) f++;
  return new TextDecoder().decode(u8.slice(p, f));
}

async function instanciar() {
  let mem;
  const stub = new Proxy({}, { get: (_, n) => (...a) => {
    if (n === 'fd_write') { const v = new DataView(mem.buffer); let s = 0;
      for (let k = 0; k < a[2]; k++) s += v.getUint32(a[1] + 8 * k + 4, true); v.setUint32(a[3], s, true); }
    return 0; } });
  const { instance } = await WebAssembly.instantiate(bytes, { wasi_snapshot_preview1: stub, env: stub });
  const e = instance.exports; mem = e.memory; if (e._initialize) e._initialize();
  return e;
}

async function ligar() {
  if (ctx) return;
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule('rasgo-worklet.js');
  const n = new AudioWorkletNode(ctx, 'rasgo', { numberOfInputs: 0, outputChannelCount: [2] });
  n.connect(ctx.destination);
  await new Promise(ok => {
    n.port.onmessage = (ev) => {
      const m = ev.data;
      if (m.tipo === 'pronto') ok();
      // seed nova, DESFAZ, REPOR, ABRIR: patch novo; 'rack': os cabos mudaram
      if (m.tipo === 'seed' || m.tipo === 'patch' || m.tipo === 'rack') {
        est.seed = m.seed; est.cabos = m.cabos;
        rack.carregar(m.texto, m.wordmark, m.tipo === 'rack');
        // módulo novo: à vista na SAÍDA por exceção, até chegar ao som
        if (m.novo >= 0 && !rack.porId.get(m.novo)?.chega) { rack.pendentes.add(m.novo); rack.layout(); }
        syncCabecalho();
      }
      if (m.tipo === 'quadro') {
        if (m.learnValor !== learn.valor) { learn.valor = m.learnValor; if (learn.mostrado?.param) mostrarLearn(); }
        rack.quadro(m.valores, m.cabos, m.ids, m.visores, m.escalas);
        est.cabos = m.cabos.length / 14;
        // o VU do cabeçalho (`setReadout`): pico contra −1 dBFS
        const f = Math.min(1, m.vu / 0.891), vu = $('vu').firstChild;
        vu.style.width = Math.round(f * 54) + 'px';
        vu.style.background = f < 0.85 ? 'var(--prata)' : 'var(--warning)';
      }
      if (m.tipo === 'salvo') salvo(m);
      if (m.tipo === 'recusa') aviso(m.modulo + (m.motivo === -1 ? ' é único no rack.' : m.motivo === -2 ? ': no máximo 4 cópias.' : ': tipo desconhecido.'));
      if (m.tipo === 'bancoAtual') abrirBanco(m.id, Math.round(m.banco));
      if (m.tipo === 'nada' && m.acao === 'desfazer') aviso('Nada para desfazer.');
      if (m.tipo === 'nada' && m.acao === 'abrir') aviso('Não consegui abrir esse arquivo: não parece um patch do Rasgo Modular (.rmp).');
    };
    n.port.postMessage({ tipo: 'wasm', bytes });
  });
  no = n;
  rack.enviar = (msg) => no.port.postMessage(msg);
  no.port.postMessage({ tipo: 'ganho', valor: est.volume });
  enviarVaria();
  if (est.espera) no.port.postMessage({ tipo: 'espera', ligada: true });
}

// Antes do primeiro clique o navegador não deixa soar, mas o rack já
// aparece: o motor da página monta o mesmo patch que o TOCAR vai tocar (a
// seed da caixa, ou o patch guardado pelo ABRE) e o desenha parado.
function mostrarAntes() {
  const e = local;
  e.rw_iniciar(48000);
  const modo = ler('abre') || 'seed';
  const guardado = modo === 'init' ? ler('init') : modo === 'last' ? ler('sessao') : null;
  let aberto = false;
  if (guardado) {
    const b = new TextEncoder().encode(guardado);
    new Uint8Array(e.memory.buffer, e.rw_entrada(b.length), b.length).set(b);
    aberto = !!e.rw_abrir(b.length);
  }
  if (!aberto) {
    const s = BigInt(seedValida() || '4303935450909092226');
    e.rw_seed(Number(s >> 32n), Number(s & 0xffffffffn));
    if (modo === 'uncabled') e.rw_descabear();
  }
  const texto = new TextDecoder().decode(new Uint8Array(e.memory.buffer, e.rw_descrever(), e.rw_texto_tamanho()).slice());
  rack.carregar(texto, cTexto(e, e.rw_wordmark()));
  rack.quadro(new Float32Array(e.memory.buffer, e.rw_valores(), e.rw_num_controles()).slice(),
              new Float32Array(e.memory.buffer, e.rw_cabos_estado(), e.rw_cabos() * 14).slice());
  est.cabos = e.rw_cabos();
}

// O primeiro clique liga o som e abre como o ABRE manda (`StartupPolicy`):
// SEED = a seed da caixa; SEM CABOS = ela, descabeada; MEU PATCH e ÚLTIMA =
// o patch guardado neste navegador (se não houver, a seed)
async function tocar() {
  if (no) return;
  const s = seedValida() || '4303935450909092226';
  aviso('Montando o patch…', 1e9);
  await ligar();
  await ctx.resume();
  const modo = ler('abre') || 'seed';
  const guardado = modo === 'init' ? ler('init') : modo === 'last' ? ler('sessao') : null;
  if (guardado) no.port.postMessage({ tipo: 'abrir', texto: guardado });
  else {
    no.port.postMessage({ tipo: 'seed', seed: s });
    if (modo === 'uncabled') no.port.postMessage({ tipo: 'descabear' });
  }
  est.avisoAte = 0; mostrarLearn();
  syncCabecalho();
}

            init: 'Este patch agora é o seu patch de abertura: na próxima vez, abre com ele. Para trocar, volte a MEU PATCH com o patch que quiser.',
            last: 'Na próxima vez, abre com a sessão como estiver ao fechar a página.' }[modo], 7000);
    syncCabecalho();

  }

  if (a === 'variaLiga') { est.variaOn = !est.variaOn; enviarVaria(); syncCabecalho(); return; }
  if (a === 'espera') {
    est.espera = !est.espera; syncCabecalho();

    return;
  }

    const s = novaSeed();
    $('seed').value = s;
    if (!no) { await tocar(); return; }
    no.port.postMessage({ tipo: 'seed', seed: s });
    return;
  }

  else if (a === 'mudar') no.port.postMessage({ tipo: 'mudar', s: sorteio() });

  else if (a === 'desfazer') no.port.postMessage({ tipo: 'desfazer' });
  else if (a === 'descabear') no.port.postMessage({ tipo: 'descabear' });
  else if (a === 'romperTodos') no.port.postMessage({ tipo: 'romperTodos' });
  else if (a === 'salvar' || a === 'banco') no.port.postMessage({ tipo: 'salvar', destino: a });
}

const LINGUA = 1;   // pt (os quatro idiomas entram na F4b)

                 salvar: 'save', abrir: 'open', desfazer: 'undo', descabear: 'uncable', espera: 'standby',

  if (q.has('insp')) {
    const n = Number(q.get('insp')) || 0;
    const c = new Float32Array(mem.buffer, e.rw_cabos_estado(), e.rw_cabos() * 14).slice();
    const d = c[n * 14 + 2], pd = c[n * 14 + 3];
    if (q.has('rel')) e.rw_cabo_relacao(d, pd, 1, c[(n + 1) * 14], c[(n + 1) * 14 + 1], 0.6);
    rack.insp = { d, pd };
  }
  for (let i = 0; i < seg * 48000 / 128; i++) e.rw_processar();
  const nc = e.rw_num_controles();
  // todos os visores (a prévia não rola): 748 números cada, como no worklet
  const ids = []; for (let k = 0; k < e.rw_num_visores(); k++) ids.push(e.rw_visor_id(k));
  const vis = new Float32Array(ids.length * 748), escalas = {};
  ids.forEach((id, k) => vis.set(new Float32Array(mem.buffer, e.rw_visor(id), 748), k * 748));
  for (const md of rack.mods)
    if (md.tipo === 'QUANTIZER' && vis[ids.indexOf(md.id) * 748 + 732] > 12.5) {
      const p = e.rw_nome_escala(md.id), bb = new Uint8Array(mem.buffer); let f = p; while (bb[f]) f++;
      escalas[md.id] = dec.decode(bb.slice(p, f));
    }
  if (q.has('espectro')) for (const md of rack.mods) if (md.tipo === 'SCOPE') rack.espectro.add(md.id);
  rack.quadro(new Float32Array(mem.buffer, e.rw_valores(), nc).slice(),
              new Float32Array(mem.buffer, e.rw_cabos_estado(), e.rw_cabos() * 14).slice(), ids, vis, escalas);
  if (q.has('rolar')) { $('rolagem').scrollTop = q.get('rolar') === 'fim' ? 1e9 : Number(q.get('rolar')); rack.desenhar(); }
  const vu = Math.min(1, e.rw_vu() / 0.891);
  $('vu').firstChild.style.width = Math.round(vu * 54) + 'px';
  est.cabos = e.rw_cabos(); est.seed = String(s);
  // `?banco`: abre o banco de escalas do QUANTIZER (captura de teste)
  if (q.has('banco')) { local = e; const qz = rack.mods.find((m) => m.tipo === 'QUANTIZER'); abrirBanco(qz.id, Math.round(e.rw_parametro(qz.id, 0))); }
  if (q.has('paletaTipo')) rack.paletaTipo = q.get('paletaTipo');
  // `?learn=TIPO.bind` (ou só TIPO): mostra esse verbete na caixa
  if (q.has('learn')) {
    const [t, b] = q.get('learn').split('.');
    const md = rack.mods.find((m) => m.tipo === t);
    const w = b && md?.w.find((x) => x.b === b);
    const h = w ? { tipo: t, bind: b, titulo: `${t}  ·  ${w.l}`, param: true } : { tipo: t, modulo: true };
    learn.mostrado = { ...verbete(h), param: !!w };
    if (w) learn.valor = cTexto(e, e.rw_learn_valor(md.id, (() => { const bb = new TextEncoder().encode(b); new Uint8Array(e.memory.buffer, e.rw_entrada(bb.length), bb.length).set(bb); return bb.length; })()));
    mostrarLearn();
  }
  no = { port: { postMessage: () => {} } };   // a leitura e o cabeçalho como se tocasse
  est.avisoAte = 0; mostrarLearn(); syncCabecalho();
  if (q.has('medir')) {   // custo de um quadro (camada fixa já pronta)
    rack.desenhar();
    const t0 = performance.now();
    for (let i = 0; i < 60; i++) rack.desenhar();
    const t1 = performance.now();
    for (let i = 0; i < 20; i++) { rack.chaveCabos = null; rack.desenhar(); }
    aviso(`${rack.vistos.length} mód · quadro ${((t1 - t0) / 60).toFixed(2)} ms · com cabos mudando ${((performance.now() - t1) / 20).toFixed(2)} ms`, 1e9);
  }
  document.title += ' · pronto';
}

if (q.has('saida')) rack.vistaSaida(true);
aplicarLeitura();
syncCabecalho();
</script>
